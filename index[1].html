<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Fixed Income Flashcards</title>
<meta name="description" content="Flashcards to study for the Fixed Income exam.">

<!-- PWA: add to home screen + offline -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fixed Income">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <!-- Everything is rendered by app.js into these view containers -->
  <header id="topbar">
    <button id="homeBtn" class="icon-btn" title="Home" aria-label="Home">&#8962;</button>
    <div id="topTitle">Fixed Income</div>
    <div id="syncPill" class="pill" title="Sync status">…</div>
    <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">&#9881;</button>
  </header>

  <main id="main">
    <section id="view-home" class="view"></section>
    <section id="view-study" class="view" hidden></section>
    <section id="view-glossary" class="view" hidden></section>
  </main>
</div>

<!-- Settings panel -->
<div id="settingsOverlay" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Settings">
    <div class="sheet-head">
      <h2>Settings</h2>
      <button id="settingsClose" class="icon-btn" aria-label="Close">&times;</button>
    </div>
    <div id="settingsBody" class="sheet-body"></div>
  </div>
</div>

<!-- Scripts: no build step, plain files -->
<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
