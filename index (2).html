<style>
/* ============================================================
   Fixed Income Flashcards — styles (mobile-first)
   ============================================================ */
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#1b2430; --muted:#6b7684;
  --line:#e4e7ec; --brand:#0f766e; --brand-d:#0b5c55;
  --got:#17795e; --got-bg:#e3f5ee; --again:#b4541a; --again-bg:#fdeee2;
  --warn-bg:#fff7d6; --warn-line:#f2d675; --warn-ink:#6b5600;
  --ok:#17795e; --err:#b42318; --wait:#8a6d00;
  --radius:16px; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.5;
  -webkit-text-size-adjust:100%;
}
#app{min-height:100vh}

/* ---------- Top bar ---------- */
#topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;
  background:var(--brand); color:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.12);
}
#topTitle{flex:1; font-weight:650; font-size:17px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.icon-btn{
  background:rgba(255,255,255,.14); color:#fff; border:none; border-radius:10px;
  width:40px; height:40px; font-size:20px; cursor:pointer; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center;
}
.icon-btn:active{transform:scale(.95)}
.pill{
  font-size:12px; font-weight:600; padding:6px 9px; border-radius:999px;
  background:rgba(255,255,255,.18); color:#fff; white-space:nowrap; flex:0 0 auto;
}
.pill-ok{background:#0e9f6e} .pill-err{background:#e4572e} .pill-wait{background:#d9a400} .pill-off{background:rgba(255,255,255,.22)}

/* ---------- Layout ---------- */
#main{max-width:820px; margin:0 auto; padding:16px 16px 60px}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- Home ---------- */
.warn{
  background:var(--warn-bg); border:1px solid var(--warn-line); color:var(--warn-ink);
  border-radius:var(--radius); padding:14px 16px; font-size:14.5px; margin-bottom:16px;
}
.warn b{color:#5a4700}
.lead{color:var(--muted); font-size:14.5px; margin:0 0 14px}
.chips{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:8px}
.chip{
  flex:1 1 auto; min-width:46%; text-align:left;
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:16px 14px; font-size:16px; font-weight:600; color:var(--ink);
  cursor:pointer; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:space-between;
}
.chip:active{transform:scale(.98)}
.chip .n{background:var(--bg); color:var(--muted); font-size:13px; padding:3px 9px; border-radius:999px; font-weight:700}
.chip-gloss{background:#eef7f5; border-color:#cfe8e3; color:var(--brand-d)}
.sec{font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:22px 0 10px}
.bars{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; box-shadow:var(--shadow)}
.bar-row{display:flex; align-items:center; gap:10px; padding:7px 0}
.bar-label{flex:0 0 52px; font-size:14px; font-weight:600}
.bar{flex:1; height:12px; background:var(--bg); border-radius:999px; overflow:hidden}
.bar-fill{height:100%; background:var(--got); border-radius:999px; transition:width .3s}
.bar-num{flex:0 0 auto; font-size:13px; color:var(--muted); font-weight:600; min-width:42px; text-align:right}
.hint-line{font-size:14px; color:var(--muted); margin-top:14px}

/* ---------- Study ---------- */
.study-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px}
.counter{font-size:14px; font-weight:650; color:var(--muted)}
.nav-btn{
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:9px 13px; font-size:14px; font-weight:600; color:var(--ink); cursor:pointer;
}
.nav-btn:disabled{opacity:.4}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px; box-shadow:var(--shadow);
}
.card-top{display:flex; gap:8px; align-items:center; margin-bottom:10px}
.daytag{background:#eef7f5; color:var(--brand-d); font-size:12.5px; font-weight:700; padding:4px 10px; border-radius:999px}
.badge{font-size:12px; font-weight:700; padding:4px 9px; border-radius:999px}
.badge-got{background:var(--got-bg); color:var(--got)}
.badge-again{background:var(--again-bg); color:var(--again)}
.q{font-size:19px; font-weight:650; margin:4px 0 16px; line-height:1.35}
.muted{color:var(--muted)}
.col-h{font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; margin-bottom:5px}
.col-body{font-size:15.5px}

/* buttons */
.btn{
  display:block; width:100%; border:none; border-radius:12px; cursor:pointer;
  font-size:16px; font-weight:650; padding:15px 16px; margin-top:12px;
}
.btn:active{transform:scale(.99)}
.btn-primary{background:var(--brand); color:#fff}
.btn-ghost{background:var(--bg); color:var(--ink); border:1px solid var(--line)}
.btn-got{background:var(--got); color:#fff}
.btn-again{background:var(--again); color:#fff}
.small{font-size:14px; padding:10px 14px; margin:0; width:auto}
.wide{width:100%}

/* answer blocks */
.answer{margin-top:4px}
.ablk{padding:12px 0; border-top:1px solid var(--line)}
.ablk:first-child{border-top:none; padding-top:4px}
.kw-list{display:flex; flex-wrap:wrap; gap:7px}
.kw{font-size:13.5px; font-weight:600; padding:5px 10px; border-radius:999px}
.kw-plain{background:#eef2f6; color:#44505e}
.kw-ok{background:var(--got-bg); color:var(--got)}
.kw-no{background:var(--again-bg); color:var(--again)}
.full{margin-top:12px; border-top:1px solid var(--line); padding-top:10px}
.full summary{cursor:pointer; font-weight:650; color:var(--brand-d); font-size:15px}
.full-body{margin-top:10px; font-size:15px}
.full-body b{color:var(--ink)}

/* recall */
.recall{
  width:100%; border:1.5px solid var(--line); border-radius:12px; padding:14px;
  font-size:16px; font-family:inherit; line-height:1.5; resize:vertical; margin-top:6px;
  background:#fff; color:var(--ink);
}
.recall:focus{outline:none; border-color:var(--brand)}

/* score */
.score{border-radius:12px; padding:12px 14px; margin:4px 0 12px; border:1px solid var(--line)}
.score-high{background:var(--got-bg); border-color:#bfe6d8}
.score-mid{background:#fff7e6; border-color:#f0dca8}
.score-low{background:var(--again-bg); border-color:#f2d2b8}
.score-num{font-size:17px; font-weight:800; color:var(--ink)}
.score-bar{height:8px; background:rgba(0,0,0,.08); border-radius:999px; overflow:hidden; margin:7px 0}
.score-fill{height:100%; background:var(--got); border-radius:999px; transition:width .3s}
.score-mid .score-fill{background:#d9a400}
.score-low .score-fill{background:var(--again)}
.score-msg{font-size:14px; color:var(--ink); opacity:.85}

/* review */
.review-cols{display:flex; flex-direction:column; gap:12px; margin-bottom:14px}
.col{background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:12px 14px}
.col:first-child{background:#f0f8f6; border-color:#d3e9e4}
.kw-wrap{margin:4px 0 6px}
.prev{background:var(--bg); border:1px dashed var(--line); border-radius:12px; padding:12px 14px; margin-top:12px}
.grade-row{display:flex; flex-direction:column; gap:0}

/* done */
.done{text-align:center}
.done h2{margin:6px 0 10px}
.done-stats{display:flex; gap:10px; justify-content:center; margin:14px 0}

/* ---------- Glossary ---------- */
.gloss-search input{
  width:100%; border:1.5px solid var(--line); border-radius:12px; padding:14px;
  font-size:16px; font-family:inherit; background:#fff; color:var(--ink);
}
.gloss-search input:focus{outline:none; border-color:var(--brand)}
.gloss-count{font-size:13px; margin:10px 2px}
.gloss-list{display:flex; flex-direction:column; gap:10px}
.gl{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:13px 15px; box-shadow:var(--shadow); font-size:15px}
.gl b{color:var(--brand-d); display:block; margin-bottom:3px; font-size:15.5px}

/* ---------- Settings sheet ---------- */
.overlay{position:fixed; inset:0; background:rgba(16,24,40,.45); z-index:40; display:flex; align-items:flex-end; justify-content:center}
.sheet{background:var(--card); width:100%; max-width:560px; border-radius:20px 20px 0 0; max-height:88vh; overflow:auto; box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet-head{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--card)}
.sheet-head h2{margin:0; font-size:18px}
.sheet-head .icon-btn{background:var(--bg); color:var(--ink)}
.sheet-body{padding:16px 18px calc(env(safe-area-inset-bottom,0px) + 24px)}
.set-block{padding:14px 0; border-top:1px solid var(--line)}
.set-block:first-child{border-top:none; padding-top:2px}
.code-box{display:flex; gap:8px; align-items:center; margin:6px 0}
.code-box code{flex:1; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:11px 12px; font-size:15px; word-break:break-all}
.code-box input{flex:1; border:1.5px solid var(--line); border-radius:10px; padding:11px 12px; font-size:15px; font-family:inherit; min-width:0}
.ok-text{color:var(--ok); font-weight:600}

/* ---------- Toast ---------- */
#toast{
  position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
  background:#1b2430; color:#fff; padding:11px 18px; border-radius:999px; font-size:14px; font-weight:600;
  opacity:0; pointer-events:none; transition:all .2s; z-index:60; max-width:90vw; text-align:center;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

/* ---------- Desktop ---------- */
@media (min-width:720px){
  .chip{min-width:0; flex:1 1 30%}
  .review-cols{flex-direction:row}
  .review-cols .col{flex:1}
  .grade-row{flex-direction:row; gap:12px}
  .grade-row .btn{margin-top:14px}
  .q{font-size:21px}
}

/* ---------- Dark mode ---------- */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13181f; --card:#1b222c; --ink:#e8edf3; --muted:#9aa6b2;
    --line:#2a333f; --brand:#15b8a6; --brand-d:#5fd6c7;
    --got:#2dd4a7; --got-bg:#123a30; --again:#f0924a; --again-bg:#3a2415;
    --warn-bg:#352f12; --warn-line:#6b5a1e; --warn-ink:#f1e3a0;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  :root:not([data-theme="light"]) .recall,
  :root:not([data-theme="light"]) .gloss-search input,
  :root:not([data-theme="light"]) .code-box input{background:#121820}
  :root:not([data-theme="light"]) .chip-gloss{background:#15302c; border-color:#235049}
  :root:not([data-theme="light"]) .daytag{background:#15302c}
  :root:not([data-theme="light"]) .col:first-child{background:#132a26; border-color:#235049}
  :root:not([data-theme="light"]) .kw-plain{background:#263039; color:#c3cdd7}
}

</style>

<script>

const SLIDE_ERRORS = "<b>Slide errors to ignore:</b> Day 3 slide 15 labels the CDS buyer \"long credit\" – the buyer is SHORT credit. Day 3 slide 54 swaps the CLO/CDO headers. Day 4 slide 13 swaps the solvency/liquidity headers; slide 29 swaps SOFR/Fed Funds. Day 1 slides 18, 48, 57, 60, 67 and Day 2 slides 3 and 10 swap column headers. Go by the content.";

const GLOSS = [["Bond","A loan cut into pieces and sold to many investors. The issuer pays interest (coupons) and pays back the face value (usually 100) at the end."],["Coupon (kupon)","The yearly interest a bond pays, e.g. 5% of 100 = 5 per year."],["Face value / par (wartość nominalna)","The amount paid back at the end, usually 100."],["Maturity (termin wykupu)","The date the bond ends and the face value is paid back."],["Issuer (emitent)","Whoever borrows by selling the bond: a government or a company."],["Yield (rentowność)","The return you earn on a bond, in % per year."],["YTM – yield to maturity","The one average yearly return you earn if you buy at today's price and hold to the end."],["Spot rate","The interest rate for one single payment at one specific date (e.g. the 3-year spot rate)."],["Forward rate","A future interest rate (e.g. from year 3 to year 4) calculated from today's spot rates."],["Yield curve (krzywa dochodowości)","Chart of interest rates for different lengths of time: 1y, 2y, 5y, 10y…"],["Discounting (dyskontowanie)","Converting future money into today's value: divide by (1 + r)^t."],["Present value – PV (wartość bieżąca)","What future money is worth today."],["Basis point – bp (punkt bazowy)","0.01%. 100bp = 1%."],["Duration","How sensitive a bond's price is to rates. Modified duration 4 → rates +1% → price ≈ −4%."],["DV01","How many $ a bond's price changes when rates move by 1bp (0.01%)."],["Convexity (wypukłość)","The bend in the price–rate curve. Positive = gain more when rates fall, lose less when they rise."],["Credit spread","Extra interest a company pays above the government rate, because it might not pay back."],["Z-spread","The single extra % added to every government spot rate so the price equals the company bond's market price."],["Default (niewypłacalność)","When a borrower doesn't pay what it owes."],["Recovery rate (stopa odzysku)","The % of the money investors still get back after a default."],["Credit rating","A grade for how safe a borrower is: AAA best … BBB lowest 'investment grade' … below = 'junk' (high yield)."],["Covenant","A promise or restriction in the bond contract (e.g. 'no more borrowing')."],["Seniority","Your place in the repayment queue if the borrower goes bankrupt. Senior = paid first."],["Callable bond","The issuer can pay it back early (it will, when rates fall)."],["Liquidity (płynność)","How easily you can sell something quickly without losing value."],["Hedge (zabezpieczenie)","A position that loses when your main position gains, and vice versa, to cancel risk."],["Long / short","Long = you own it and gain if it rises. Short = you sold it (or bet against it) and gain if it falls."],["Derivative (instrument pochodny)","A contract whose value depends on something else (rates, a bond, inflation, a company's default)."],["Notional (kwota nominalna)","The amount a derivative is calculated on (e.g. €10m). It is usually never paid itself."],["Interest rate swap (IRS)","Two parties exchange fixed interest payments for floating ones on a notional amount; only the difference is paid."],["Fixed vs floating rate","Fixed = always the same. Floating = changes with a market rate."],["Swap rate","The fixed rate in a swap that makes the swap worth 0 at the start."],["CDS – credit default swap","Insurance against a company defaulting. Buyer pays a yearly premium; seller pays the loss if default happens."],["Inflation swap","One side pays an agreed inflation rate, the other pays real inflation. One payment at the end."],["Breakeven inflation","The inflation rate both sides of an inflation swap agree on today."],["Futures (kontrakt terminowy)","A standard exchange contract to buy or sell something later at a price agreed today."],["Margin (depozyt zabezpieczający)","The small deposit you post to hold a futures position."],["Option","The right, but not the obligation, to buy or sell something at a set price."],["Securitisation (sekurytyzacja)","Packing many loans together and selling them to investors as a tradeable security."],["ABS – asset-backed security","A security made from a pool of loans (car loans, credit cards, mortgages…). Investors are paid from the borrowers' repayments."],["MBS – mortgage-backed security","An ABS made from home loans (mortgages, kredyty hipoteczne)."],["Prepayment (wcześniejsza spłata)","When a borrower pays back a loan early, e.g. to refinance at a lower rate."],["SPV – special purpose vehicle (spółka celowa)","A separate company created to hold the loans, so they are safe if the bank fails."],["Tranche (transza)","A slice of a loan pool with its own risk: senior (safest), mezzanine (middle), equity (riskiest)."],["Waterfall","The order of payment in a securitisation: cash goes to senior first; losses hit equity first."],["CDO / CLO","Pools split into tranches. CLO = loans to heavily indebted companies. CDO = bonds or other ABS."],["CMO","An MBS pool split into tranches that receive principal one after another (A, then B, then C)."],["IO / PO","A mortgage pool split into an interest-only part (IO) and a principal-only part (PO)."],["Principal (kapitał)","The borrowed amount itself, as opposed to the interest."],["Central bank","The bank for banks: issues money, sets the main interest rate, lends to banks in a crisis. US = the Fed."],["Reserves (rezerwy)","Money that banks keep in their accounts at the central bank."],["Fed Funds rate","The rate at which US banks lend reserves to each other overnight, without collateral."],["Open market operations","The Fed buying or selling government bonds to add or remove reserves and steer the Fed Funds rate."],["QE – quantitative easing","The central bank buying lots of long-term bonds to push long-term rates down."],["Repo","Sell a bond today, buy it back tomorrow slightly higher = a short loan secured by the bond."],["Collateral (zabezpieczenie)","An asset given as security for a loan; the lender keeps it if you don't pay."],["SOFR","The US overnight rate on repo loans secured by government bonds; it replaced LIBOR."],["Money market","The market for loans shorter than one year (T-bills, repo, commercial paper)."],["T-bill","A short US government bond (under 1 year)."],["Commercial paper","A short, unsecured IOU from a strong company (under 270 days)."],["Leverage (dźwignia)","Investing with borrowed money; it boosts both gains and losses."],["Fiat money (pieniądz fiducjarny)","Money not backed by gold; valuable because of law and trust."],["Treasury","A US government bond. 'The Treasury' = the US finance ministry."]];

const CARDS = [["Day 1","Compare debt and equity as sources of financing.","<b>Debt</b> is a contractual obligation: fixed interest and principal repaid at maturity, <b>senior</b> in default, no voting rights, capped upside, and interest is tax-deductible. <b>Equity</b> is ownership: discretionary dividends, permanent capital, <b>last</b> in default, unlimited upside, and issuing it dilutes existing owners. Governments, firms and households can all borrow, but only firms can issue equity.",["senior","tax-deductible","dilution","residual claim","loan","paid first","no vote","paid last","gains"],"A company can get money in two ways. Debt: it borrows and must pay it back with interest. Equity: it sells shares, i.e. pieces of ownership (udziały). If the company goes bankrupt, lenders are paid first and shareholders get whatever is left, usually nothing. But shareholders can earn a lot if the company does well; lenders only ever get their interest.","Debt is a loan. You pay fixed interest, pay it back at the end (maturity), and you are paid first if the company fails. It has no voting rights, and the interest lowers the tax. Equity is ownership (shares): no fixed payments, paid last if the company fails, but the gains have no limit. Selling new shares gives away part of the company (dilution)."],["Day 1","Why might a company prefer to issue debt rather than equity?","Debt does not dilute ownership or voting control, and interest is tax-deductible while dividends are not, so it is a cheaper source of capital. Terms (amount, maturity, currency) can be tailored, and owners keep full decision-making power as long as payments are made. The trade-off is fixed obligations and default risk.",["no dilution","tax shield","control","flexibility","cheaper","keep ownership","fixed payments","default"],"If a company borrows, the owners still own 100% of the company and keep all the decisions. Interest on debt lowers the company's tax bill (it is tax-deductible), dividends to shareholders do not. So debt is cheaper. The downside: interest must be paid every year, even in a bad year, or the company defaults (niewypłacalność).","Debt does not give away ownership or control, and the interest lowers the tax, so it is cheaper than equity. The downside is that you must make fixed payments and pay it back, or you default."],["Day 1","Why do investors like debt?","Payments are contractual and predictable, which makes debt easy to value and to match against liabilities. Debt is senior to equity in default, so it is less risky for the same issuer, and the maximum gain and loss are known. Debt markets are also deep and liquid.",["predictable","seniority","defined risk","liquidity","fixed payments","paid first","safer","easy to sell"],"As a lender you know exactly how much you will get and when. If the company fails, you are paid before the shareholders. You know your maximum gain and loss in advance. And bonds are easy to buy and sell.","The payments are fixed, so you know what you will get. Debt is paid before equity if the company fails, so it is safer. And debt markets are big, so it is easy to buy and sell."],["Day 1","Why is the interest rate called the 'lynchpin' of the economy?","It is the price of borrowing: low rates make borrowing cheap so firms invest and households spend, high rates cool the economy. It is the threshold separating productive from unproductive investment. The central bank uses it as its main lever; mistakes are costly – too low for too long causes excess borrowing and inflation, too high starves investment and raises unemployment.",["price of credit","policy lever","misallocation","price of borrowing","central bank","inflation","spending"],"The interest rate is the price of borrowing money. When it is low, people and firms borrow and spend, so the economy grows (too low for too long → prices rise = inflation). When it is high, borrowing is expensive, so the economy slows (too high → people lose jobs). That is why the central bank (the bank that controls a country's money, e.g. the Fed in the US) steers the economy with the interest rate.","The interest rate is the price of borrowing money. Low rates make people borrow, invest and spend more; high rates slow things down. It is the central bank's main tool, and getting it wrong causes inflation or unemployment."],["Day 1","What is the difference between a loan and a bond?","A loan is a private, bilateral contract (usually with a bank) with negotiated terms; it stays on the lender's balance sheet and normally cannot be traded – relationship-based, suited to smaller borrowers. A bond is a standardised, tradeable security sold to many investors, with terms set in a public indenture; it trades in a secondary market with transparent prices – suited to large borrowers.",["bilateral","tradeable","indenture","secondary market","one lender","many investors","traded"],"A loan is a deal between you and one bank. It stays with that bank and cannot easily be sold to someone else. A bond is a loan cut into many small pieces and sold to many investors; each piece can be resold to other investors on the market (the secondary market). Small companies use bank loans, big companies and governments issue bonds.","A loan is a private deal with one lender (usually a bank) and is not traded. A bond is a standard product sold to many investors and can be bought and sold in the market. Loans fit smaller borrowers, bonds fit large ones."],["Day 1","What is a bond indenture?","The legal contract between the issuer and bondholders (umowa emisyjna). It sets coupon, maturity, covenants, seniority and any embedded options, and is administered by a trustee on behalf of bondholders. Because the same public terms apply to every holder, bonds can be standardised and traded.",["legal contract","covenants","trustee","issuer","bondholders","rules"],"The indenture (umowa emisyjna) is the rulebook of a bond: the coupon (the yearly interest payment), the maturity (the date the money is paid back), the covenants (promises and restrictions for the company) and the order of repayment. A trustee (powiernik) checks that the company follows the rules on behalf of all bondholders.","The indenture is the legal contract between the issuer and the bondholders. It sets the coupon, maturity, covenants (rules), seniority and any options. A trustee makes sure the issuer follows it."],["Day 1","Describe the four basic bond structures.","<b>Fixed rate:</b> coupon set at issue, never changes. <b>Floating rate:</b> coupon resets to a reference rate plus a fixed spread, so it moves with market rates. <b>Zero-coupon:</b> no coupon, issued at a discount, return = price vs par. <b>Inflation-linked</b> (e.g. TIPS): principal indexed to CPI, so the real value is preserved.",["fixed","floating","zero","inflation-linked","no coupons","bought cheap","amortising","spread"],"Fixed rate: the coupon (yearly interest) is always the same, e.g. 5%. Floating rate: the coupon moves with a market rate, e.g. market rate + 1%. Zero-coupon: no interest during the life; you buy it cheap (e.g. 80) and get 100 at the end. Amortising: the borrowed amount is paid back in parts over time, like a mortgage.","Fixed rate: the coupon never changes. Floating rate: a market rate plus a spread. Zero-coupon: no coupons, bought cheap, pays 100 at the end. Amortising: the principal is paid back bit by bit."],["Day 1","Why does a callable bond pay a higher yield than a comparable non-callable bond?","The issuer holds the option to redeem early and uses it when rates fall below the coupon – exactly when the investor would gain and now has to reinvest at low rates (reinvestment risk). The investor's price upside is capped near the call price (negative convexity). Investors demand compensation for this short option: a higher coupon/yield or a lower issue price.",["issuer's option","rates fall","reinvestment risk","negative convexity","called early","higher yield","short a call"],"A callable bond lets the company pay the bond back early. It will do that when market rates fall, because it can then borrow again more cheaply. So the investor loses the bond exactly when it was a good deal and must reinvest at the lower rates. To accept that risk, investors want a higher interest rate.","The issuer can pay the bond back early, and will do it when rates fall - exactly when the bond is worth most to you. You are short a call option, so you ask for a higher yield to make up for it."],["Day 1","Explain putable and convertible bonds and how investors pay for them.","A <b>putable</b> bond lets the investor sell it back early – useful when rates rise, so the investor can reinvest at better terms. A <b>convertible</b> lets the investor convert into a set number of shares – downside protection plus equity upside. Because the option belongs to the investor, the investor pays for it by accepting a lower yield/coupon.",["investor's option","lower yield","sell back","swap for shares","lower coupon"],"A putable bond lets the INVESTOR give the bond back to the company early, which is useful when rates rise. A convertible bond lets the investor swap the bond for company shares, which is useful if the share price rises. Both are extras that benefit the investor, so the investor accepts a lower coupon (yearly interest).","A putable bond lets you sell it back to the issuer early. A convertible lets you swap it for shares. Both options belong to you, the investor, so you pay for them by accepting a lower coupon."],["Day 1","Market rates rise after a bond is issued. What happens and why?","The coupon is fixed, so the bond's payments become less attractive than new bonds paying the higher market rate. Investors will only buy it at a lower price, so the price falls until its yield matches the market. Price and yield always move in opposite directions.",["fixed coupon","price falls","inverse","below market","price drops","rates up prices down"],"Say your bond pays 4%, but new bonds now pay 6%. Nobody will pay 100 for your 4% bond when they can get 6% elsewhere. So your bond's price must fall below 100, until a buyer earns about 6% in total. Rule: market rates up → bond prices down.","The bond's fixed coupon is now below the market rate, so people will only buy it for less. The price drops below 100 until its yield matches the new market rate. Rates up, prices down."],["Day 1","What is the yield curve and why does it matter?","It plots yield against maturity for bonds of the same credit quality (usually government bonds). It is the foundation for pricing every bond, it shapes portfolio construction, and its shape signals macroeconomic conditions (e.g. expectations of future rates).",["maturity","same credit","benchmark","yields","inverted","recession","slopes up"],"The yield curve (krzywa dochodowości) is a chart showing how much interest government bonds pay for each length of time: 1 year, 2 years, 10 years… Usually longer = higher rate. If short bonds pay more than long ones (an inverted curve), a recession often follows. All other bonds are priced relative to this curve.","The yield curve shows yields for different maturities. It usually slopes up; when it is inverted (upside down) it often warns of a recession. It is the benchmark used to price all other bonds."],["Day 1","Nominal vs real rates – what's the relationship?","The nominal rate is the quoted yield; the real rate is what remains after inflation: real ≈ nominal − expected inflation (5% nominal with 3% inflation ≈ 2% real). Bond investors bear inflation risk – if inflation exceeds expectations, the real return falls. Higher expected inflation therefore leads investors to demand higher nominal yields; TIPS target the real rate directly.",["purchasing power","inflation risk","TIPS","nominal","real","after inflation"],"The nominal rate is the number you see, e.g. 5%. The real rate is what you really earn after prices go up (inflation). 5% interest with 3% inflation ≈ 2% real.","Nominal rate is about the real rate plus expected inflation. For example, a 5% nominal yield with 3% inflation gives roughly a 2% real return. Real is what you earn after inflation."],["Day 1","How does a US Treasury auction work?","The Treasury announces the security and amount in advance. Institutions submit <b>competitive bids</b> (yield + quantity), accepted from the lowest yield up until the issue is filled; retail submits <b>non-competitive bids</b> and accepts the clearing yield (up to $10m). It is a uniform-price ('Dutch') auction: every winner receives the same <b>stop-out</b> yield, and the coupon is set just below it (nearest 1/8%).",["competitive","non-competitive","stop-out rate","uniform price","bid","same yield","lowest yield first"],"The US government (the Treasury) sells its bonds at an auction. Big investors bid: 'I'll buy this amount if I get this yield (interest rate)'. Small investors just accept the result. The government accepts the bids with the lowest rates first, until it has sold everything. All winners get the same rate: the highest one accepted.","The Treasury announces the sale. Big institutions bid a yield and an amount; small investors bid without naming a yield. Bids are filled from the lowest yield up, and everyone who wins pays the same final yield (the stop-out rate)."],["Day 1","What are primary dealers?","Banks and broker-dealers designated by the New York Fed (24 in 2026). They are obliged to bid meaningfully at every Treasury auction, to make two-way markets in Treasuries and to act as counterparties in the Fed's open market operations. In return they deal directly with the Fed, use its repo facilities and gain prestige and deal flow.",["obligations","privileges","Fed counterparty","big banks","must bid","trade with Fed","liquidity"],"Primary dealers are a group of big banks that must buy at every US government bond auction and must keep buying and selling these bonds afterwards. In return they get to trade directly with the Fed (the US central bank). They make sure every auction is a success.","Primary dealers are big banks that must bid at every Treasury auction and always quote prices in Treasuries. In return, they get to trade directly with the Fed. This keeps demand and liquidity strong."],["Day 1","Explain the capital structure and why seniority matters.","In bankruptcy, claims are paid in strict order: senior secured (claim on pledged collateral) → senior unsecured → subordinated → equity (last). Seniority determines expected recovery and therefore risk: the higher the seniority, the lower the risk and the lower the yield investors require.",["secured","unsecured","subordinated","recovery","order of payment","equity last","higher yield"],"The capital structure is the queue for being repaid when a company goes bankrupt. First: secured debt (backed by assets, zabezpieczony). Then senior debt, then subordinated debt (podporządkowany), and last the shareholders. The further back in the queue, the bigger the risk of getting nothing, so the higher the interest investors demand.","If a company fails, claims are paid in a set order: secured debt, then senior unsecured, then subordinated, then equity last. The further back you are, the less you get back, so you ask for a higher yield."],["Day 1","What are affirmative and negative covenants? Give examples.","Covenants are binding conditions in the indenture that protect bondholders. <b>Affirmative</b> covenants require actions – maintain minimum financial ratios (e.g. interest coverage), provide financial reports, maintain pledged assets, comply with laws and taxes. <b>Negative</b> covenants restrict actions – limits on additional debt, asset sales or M&amp;A, dividend payments and capital expenditure.",["must do","must not do","protect bondholders","affirmative","negative","rules"],"Covenants are promises the company makes in the bond contract. Affirmative covenants = things it MUST do: publish accounts, pay taxes, insure its assets. Negative covenants = things it must NOT do: borrow much more, sell important assets, pay big dividends to shareholders. They protect the lenders.","Affirmative covenants say what the issuer MUST do (publish accounts, pay taxes, keep up its assets). Negative covenants say what it must NOT do (borrow more, sell key assets, pay big dividends). Both protect the bondholders."],["Day 1","What are the main risks of a corporate bond for an investor?","<b>Rate risk</b> (price falls when rates rise), <b>default risk</b> (missed payments; recovery depends on seniority), <b>spread risk</b> (the credit spread widens even if Treasury yields are unchanged), <b>call risk</b> (early redemption when rates fall → reinvestment at lower rates) and <b>liquidity risk</b> (wider bid-ask, dealers withdraw in stress).",["rate","default","spread","call","liquidity","downgrade"],"Rates rise → the bond's price falls. The company doesn't pay you back (default). The company's credit rating is cut → the price falls. You can't sell the bond easily (liquidity risk). The company pays you back early when it suits them, not you (call risk).","Interest rate risk, default risk, the risk of a downgrade or wider spread, liquidity risk, and call risk if the bond can be called."],["Day 1","A corporate bond's price falls while Treasury yields are unchanged. Explain.","Its yield = Treasury yield + credit spread. The spread can widen independently because of weaker issuer financials, a downgrade, sector stress, risk-off sentiment or lower liquidity. A wider spread raises the yield and therefore lowers the price, even with Treasuries flat – that is spread risk.",["credit spread","widening","downgrade","spread went up","more default risk"],"A company's bond pays the government rate plus an extra amount for the risk that the company might not pay back. This extra is the credit spread. If the government rate hasn't moved but the bond price fell, the spread went up: the market is more worried about this company (bad results, rating cut).","Corporate yield = Treasury yield + credit spread. If Treasury yields did not move, then the credit spread must have gone up (widened). The market now sees more default risk - maybe bad results or a downgrade."],["Day 1","What do credit ratings do and what are their weaknesses?","Agencies (S&amp;P, Moody's, Fitch) assess the ability and willingness to repay; investment grade runs from AAA to BBB−/Baa3, below that is high yield. The rating largely determines the credit spread, and a downgrade to high yield can force institutional holders to sell. Weakness: the issuer-pays model creates a conflict of interest (seen in 2008 with AAA structured products).",["investment grade","high yield","issuer pays","forced selling","grade","conflict of interest","too late"],"Rating agencies (S&P, Moody's, Fitch) give each borrower a grade for how safe it is: AAA is the best, below BBB is called 'junk' or high yield. Problems: the company being rated pays the agency (conflict of interest), ratings often change too late, and in 2008 they gave AAA to very risky mortgage products.","Ratings turn default risk into a simple grade and show if a bond is investment grade. Weak points: the issuer pays the agency (a conflict of interest), ratings change too late, and they were badly wrong on ABS in 2008."],["Day 1","How can a government reduce its debt-to-GDP ratio?","Cut spending or raise taxes (politically hard, and in the US taxes would need to be huge), grow GDP faster than debt (the ideal – how the US cut post-WWII debt), inflate it away (works only briefly, until expectations adjust and nominal rates rise), or default (common for foreign-currency sovereigns, but unthinkable for the US because it would destroy the dollar's reserve status).",["growth","inflation","default","fiscal restraint","spend less","tax more"],"Debt-to-GDP = government debt compared with the size of the economy. Four ways to cut it: spend less or tax more (politically hard); grow the economy faster than the debt (the best way, used by the US after WWII); let inflation shrink the real value of the debt (works only briefly); or not pay (default, unthinkable for the US).","Spend less or tax more, grow the economy faster than the debt (the best way), let inflation shrink the debt (works only briefly), or default (unthinkable for the US)."],["Day 1","How is the economic system organised, and what does the financial economy do?","The real economy produces and consumes goods and services; resources are scarce and production comes before revenue, so firms need funding. The financial economy channels savings and credit to those who need them, connects resources with opportunities, solves the intertemporal problem (borrow today against future income) and creates credit – banks lend money into existence. Households, businesses, governments and financial institutions all lend to, borrow from and invest in each other.",["real vs financial economy","intertemporal","credit creation","four sectors","savings","borrow","credit"],"The real economy makes and consumes goods and services. But you need money before you can produce anything. The financial economy moves money from people who save to people who need it, and lets people borrow today against money they will earn later. Banks also create new money when they lend.","The real economy makes goods and services. The financial economy moves savings to people who need money, lets people borrow against future income, and creates credit."],["Day 1","Describe the flow of funds between lenders and borrowers.","Lenders (households, institutions) provide funds either through commercial banks (deposits → loans) or directly through debt markets (buying bonds), often via financial institutions such as asset managers and pension funds. The central bank sits beneath the system, creating base money and steering rates, while commercial banks create credit money when they lend.",["banks vs markets","intermediaries","money creation","lenders","borrowers","deposits","bonds","central bank"],"Money moves from savers to borrowers in two ways. Through a bank: you deposit money, the bank lends it out. Or directly through the market: you buy a bond. Under everything sits the central bank, which creates the base money and sets the interest rate.","Lenders fund borrowers in two ways: indirectly through banks (deposits become loans), or directly through markets (buying bonds). The central bank holds it all up by creating base money and setting rates."],["Day 1","What are the key facts about global and US debt?","Global debt exceeds $385T, about 3.3× global GDP, spread across corporations (~29%), governments (~27%), financial institutions (~25%) and households (~19%) – no sector dominates. US debt is about $110T, with government the largest borrower (~37%). In FY2025 the US spent $7.3T against $5.2T revenue – a $2.1T deficit; the dollar's reserve-currency status creates structural foreign demand for Treasuries.",["$385T","3.3× GDP","$2.1T deficit","reserve currency","global debt","government biggest"],"The world has over $385 trillion of debt, about 3.3 times the world's yearly output (GDP), shared fairly evenly between companies, governments, banks and households. The US has about $110 trillion; the government is the largest borrower. In 2025 the US government spent $7.3T but collected only $5.2T, a $2.1T gap (deficit).","Global debt is over $385T, about 3.3x world GDP, across all sectors. US debt is about $110T, the government is the biggest borrower, and the 2025 deficit was $2.1T."],["Day 1","Who issues bonds?","<b>Sovereigns</b> (Treasuries, Gilts, Bunds) – risk-free in local currency and the benchmark for all other bonds. <b>Corporates</b> – carry credit risk and pay a spread; investment grade or high yield; subject to covenants. <b>Others</b> – supranationals (World Bank, IMF, EIB, near-sovereign quality), agencies (Fannie Mae, Freddie Mac, implicit government backing) and municipalities (varying quality, often tax advantages).",["sovereign","corporate","supranational","agency","municipal","government","companies","spread"],"Governments (sovereigns): the safest bonds; every other bond is compared with them. Companies (corporates): might go bankrupt, so they pay more. Others: international organisations like the World Bank (supranationals), government-backed agencies (e.g. Fannie Mae), and cities (municipalities).","Governments (safe in their own currency and the benchmark), companies (credit risk, so they pay a spread), and others: supranationals, agencies and cities (municipalities)."],["Day 1","What are the basic debt instruments and corporate debt instruments?","Basic: loans (bilateral, not tradeable), bonds (tradeable), money market instruments (under 1 year: T-bills, commercial paper, CDs – for liquidity management) and securitised instruments (pools of loans repackaged into securities). Corporate: bonds (1–30 years, indenture, rated), <b>commercial paper</b> (unsecured, under 270 days, only for strong credits, no indenture – working capital) and convertibles (lower coupon for equity upside).",["money market","commercial paper","securitised","loans","bonds","convertibles","under one year"],"Basic types: loans (from a bank, not tradeable), bonds (tradeable), money market instruments (loans for less than one year, e.g. T-bills = short government bonds, and commercial paper = short company IOUs) and securitised products (many loans packed together into one tradeable security). For companies: bonds, commercial paper and convertible bonds (can be turned into shares).","Basic ones: loans, bonds, money-market instruments (under one year) and securitised products. Company ones: bonds, commercial paper (short-term, unsecured, for strong firms) and convertibles."],["Day 1","Corporate bonds vs Treasury securities?","Treasuries are issued by auction, have simple standardised terms with no covenants or options, are backed by the full faith and credit of the US (no default risk) and set the risk-free rate for each maturity – the most liquid securities in the world. Corporates are issued by firms, governed by an indenture with covenants, seniority and options, carry default risk and are priced as Treasury yield + credit spread.",["no default risk","covenants","credit spread","most liquid","default risk","spread"],"US government bonds (Treasuries) are simple, have no extra rules or options, and the US will always pay, so there is no default risk. They are the most traded bonds in the world. Company bonds have covenants (rules), options and a risk that the company won't pay, so they pay the government rate + a credit spread (extra for risk).","Treasuries are simple, have no default risk and are the most liquid bonds in the world. Corporates have covenants, options and default risk, so they pay Treasury yield + a credit spread."],["Day 2","What are STRIPS and why are they useful?","STRIPS split a Treasury bond into its individual cash flows – each coupon and the principal become separate zero-coupon securities. Their prices directly give spot (zero-coupon) rates, so they are the empirical basis of the zero curve, and pension funds use them for exact liability matching. Downsides: only in a few sovereign markets and less liquid than on-the-run bonds.",["zero-coupon pieces","spot rates","liability matching","split","each payment","spot rate"],"A normal bond pays a coupon every year plus 100 at the end. STRIPS cut that bond into separate pieces: each payment becomes its own zero-coupon bond (a bond that pays only once, at the end). Their prices show directly the spot rate (stopa spot = the interest rate for one payment at one date) for each year.","STRIPS cut a coupon bond into separate zero-coupon bonds, one for each payment. Their prices give you the spot rate for each maturity directly."],["Day 2","What is bootstrapping and when do you need it?","Where no STRIPS exist, spot rates are inferred from coupon bond prices one maturity at a time. Start with the shortest bond; at each step the earlier spot rates are known, so you subtract the PV of earlier cash flows from the price and solve for the last spot rate.",["sequential","coupon bonds","earlier rates known","spot rates","one at a time","step by step"],"A spot rate is the interest rate for money paid at one specific date. Bootstrapping finds the spot rates step by step from normal bond prices: first year 1, then use it to find year 2, then year 3… You need it when there are no zero-coupon bonds for every year.","Bootstrapping finds spot rates one maturity at a time from coupon-bond prices, using the spot rates you already found. You need it when you have no zero-coupon prices."],["Day 2","Why price a bond with the spot curve rather than one YTM?","Each cash flow occurs at a different time and money at each maturity has its own market rate. Discounting every cash flow at its own spot rate prices the bond consistently with all other instruments and avoids arbitrage. YTM is just the single rate that reproduces that price – an average, not a discount rate.",["each cash flow","no-arbitrage","YTM = average","own spot rate","average","mispricing"],"Money in 1 year and money in 10 years are not worth the same, and they have different interest rates. YTM (yield to maturity) uses one average rate for all payments. The spot curve gives each payment its own correct rate, so the price is more accurate.","Each payment happens at a different time, so each should be discounted at its own spot rate. One YTM is just an average, and it can misprice bonds with different payment patterns."],["Day 2","What does the z-spread measure?","The constant spread that, added to every spot rate, makes the discounted cash flows equal the bond's market price. It measures the extra yield investors demand over the risk-free curve for credit, liquidity and other risks. A higher z-spread means a lower price.",["constant spread","credit risk","over spot curve","one spread","market price","liquidity"],"A company bond is riskier than a government bond, so it must be cheaper. The z-spread is the extra % you add to every government spot rate so that the calculated price equals the bond's real market price. It is the extra pay for the company's risk.","The z-spread is the one spread you add to every spot rate so that the discounted payments equal the bond's market price. It measures the pay-off for credit and liquidity risk."],["Day 2","Explain Macaulay and modified duration in words.","Macaulay duration is the PV-weighted average time (in years) until you receive the bond's cash flows; a zero-coupon bond's duration equals its maturity, a coupon bond's is shorter. Modified duration = Macaulay ÷ (1 + y) and gives the approximate % price change for a 1-percentage-point change in yield. Higher duration means more interest rate risk.",["weighted average time","% price change","rate risk","Macaulay","modified","average time"],"Duration measures how sensitive a bond's price is to interest rates. Macaulay duration = the average time (in years) until you get your money back. Modified duration = how many % the price changes when rates move by 1 percentage point. Modified duration 4 → rates +1% → price about −4%.","Macaulay duration is the average time until you get your money. Modified duration is the % price change for a 1% change in yield: a modified duration of 4 means about -4% if yields rise 1%."],["Day 2","Why do duration and DV01 fall when yields rise?","Higher yields shrink distant cash flows proportionally more, so the earlier cash flows carry more weight and the average time shortens. The price is also lower, so each basis point moves fewer dollars. Longer maturity or lower coupon, by contrast, raise duration.",["distant cash flows","weights","lower price","higher yields","duration falls","shorter"],"When rates rise, money far in the future is discounted more heavily, so it counts for less. The average time until you are paid (duration) gets shorter. DV01 (how many $ the price moves for a 0.01% rate change) also falls, because the price is already lower, so there is less to lose.","Higher yields shrink the value of far-off payments the most, so the average time drops and duration drops. DV01 drops too, because the price itself is now lower."],["Day 2","What is convexity and why is positive convexity good?","Duration treats the price-yield relationship as a straight line, but it is curved. With positive convexity the price rises more when yields fall than it falls when yields rise by the same amount – asymmetric in the investor's favour. Callable bonds and MBS can have negative convexity, which is bad for the holder.",["curvature","asymmetry","correction to duration","bend","rise more","fall less","good"],"Duration pretends the price–rate relationship is a straight line, but really it is curved. Convexity (wypukłość) is that curve. Positive convexity: when rates fall you gain MORE than duration says, when rates rise you lose LESS. It is always good for the bond owner.","Convexity is the curve (bend) in the price-yield line. With positive convexity, prices rise more when yields fall and fall less when yields rise than duration alone says. That is good for the holder."],["Day 2","How do you hedge a corporate bond's interest rate risk, and what risk remains?","Compute the bond's DV01 and take an offsetting position with the same DV01 – short Treasuries, sell bond futures or enter a pay-fixed swap; hedge ratio N = DV01(position) ÷ DV01(hedge). Rate moves then cancel out. Credit spread risk (and liquidity risk) remains; it could be hedged separately by buying CDS protection.",["DV01 matching","hedge ratio","spread risk remains","short Treasuries","DV01 zero","spread risk"],"A company bond loses value when rates rise. To protect it, you sell (short) a government bond or a futures contract with the same DV01 (same $ change for a 0.01% rate move). If rates move, the gain on one covers the loss on the other. What's left: the company's own risk. If its credit spread rises, the hedge does not help.","Short Treasuries or futures with the same DV01, so the total DV01 = 0 and equal rate moves cancel out. What is left is credit spread risk, plus curve and basis risk."],["Day 2","What does it mean if forward rates are realised, and why?","Forwards are the future rates implied by today's curve under no-arbitrage. If they are realised, every strategy over a horizon – holding a zero, rolling short bonds or holding and selling a long bond – earns the same return: the spot rate for that horizon. Deviations from the forwards are what create gains or losses.",["no-arbitrage","horizon return = spot","forward rates","break-even","same return"],"Forward rates are future interest rates that are hidden inside today's yield curve. If they really happen, it doesn't matter which bond you buy: every bond earns the same, equal to today's spot rate for your holding period.","If forward rates come true, every bond earns the same return over the period: today's spot rate for that period. Forwards are the break-even rates that make all strategies equal."],["Day 2","Clean vs dirty price – what and why?","Coupons are paid on fixed dates but bonds trade every day, so the seller has earned part of the next coupon. The buyer pays this <b>accrued interest</b> on top: dirty (full) price = clean price + accrued interest = PV of future cash flows. The dirty price drifts up and drops on coupon dates; the clean price removes this so bonds are comparable – it is what screens quote.",["accrued interest","settlement price","quoting convention","clean","dirty","seller owed"],"Between coupon dates, interest builds up (accrued interest = odsetki narosłe). The clean price is the price without it; this is the price you see quoted. The dirty price is what you actually pay: clean price + accrued interest, because the seller held the bond for part of the year and is owed that interest.","Dirty price = clean price + accrued interest. Prices are quoted clean so they don't jump on coupon days, but you pay the dirty price, because the seller is owed interest for the days they held the bond."],["Day 2","On-the-run vs off-the-run Treasuries – why do yields differ?","On-the-run is the most recently issued bond of a maturity and the most liquid; off-the-run are older issues. Cash flows and credit are almost identical, so the small extra yield on off-the-run bonds is a liquidity premium. Relative value traders buy the cheap one and sell the rich one with matched DV01 to earn the gap.",["liquidity premium","relative value","newest","older","extra yield","liquidity"],"On-the-run = the newest government bond of a given length (e.g. the newest 10-year). Everyone trades it, so it is the easiest to buy and sell (most liquid). Off-the-run = older bonds, almost the same but traded less, so they pay slightly more. That small extra is payment for lower liquidity (płynność).","On-the-run is the newest, most traded issue; off-the-run bonds are older. Their payments are almost the same, so the small extra yield on off-the-run bonds is just a liquidity premium."],["Day 2","What is a relative value trade and what are its risks?","Buy the relatively cheap security and sell the rich one, matching DV01 so you bet on the spread, not on the level of rates (e.g. on/off-the-run, coupon bond vs STRIPS, 2s-5s-10s butterfly). You profit as the gap closes and earn carry meanwhile. Risks: the gap can widen before it closes, and financing costs.",["matched DV01","spread bet","butterfly","cheap vs expensive","gap closes","gap widens"],"You buy a bond that looks too cheap and sell a very similar one that looks too expensive, with the same DV01, so a general move in rates doesn't matter. You bet only that the price gap will close. Risk: the gap can first get bigger, and borrowing to fund the trade costs money.","Buy the cheap bond and sell the similar expensive one with matched DV01, betting the gap closes - not on where rates go. Risks: the gap can widen first, and financing costs money."],["Day 2","How does fixed-income analysis differ from equity analysis?","Bond cash flows are contractually defined, so valuation is the PV of a known stream discounted at the required yield – modelling is precise. Pricing linkages are strong: no-arbitrage ties together bonds of similar maturity, credit and structure. Equity cash flows are discretionary, valuation rests on uncertain earnings forecasts and multiples, and each stock is priced more independently.",["contractual cash flows","no-arbitrage","precise","fixed payments","discounting","uncertain","forecast"],"With a bond you know in advance how much you'll get and when, so you just calculate its value (discounting). With shares nothing is fixed; you have to guess the company's future profits.","Bond payments are fixed by contract, so value comes from discounting known payments. Equity payments are uncertain, so value depends on forecasting the company's earnings."],["Day 2","What is the time value of money and how do you compare investments?","A dollar today is worth more than a dollar tomorrow because it can earn interest: FV = PV(1+r)^n, PV = FV/(1+r)^n, r = (FV/PV)^(1/n) − 1. To compare investments of different lengths, use the annualised compounded return (CAGR), not total return – e.g. 100 → 161 in 5 years (10.0% p.a.) beats 150 → 300 in 8 years (9.1% p.a.) even though the second doubles the money.",["compounding","CAGR","annualise","money today worth more","present value","annual return"],"Money today is worth more than money in a year, because today you can invest it and earn interest. To compare investments, you convert everything to today's value (discounting, dyskontowanie) or to an average yearly return (CAGR = compound annual growth rate).","Money today is worth more than money later, because it can earn interest. You compare investments by bringing cash flows to today's value, or by comparing annual returns (CAGR)."],["Day 2","What is 'pull to par'?","As a bond approaches maturity its price converges to face value, whatever price it started at, because the final payment is the face value. Premium bonds drift down to 100 and discount bonds drift up to 100.",["converges to face value","toward 100","at maturity","face value"],"At the end you always get 100. So as the maturity date gets closer, the bond's price moves toward 100: a cheap bond rises to 100, an expensive one falls to 100. This is pull to par.","As the end date gets closer, a bond's price moves toward its face value of 100, whether it started above or below that."],["Day 2","What is the credit spread, what drives it, and why is it additive with rate risk?","The credit spread is the z-spread of a corporate bond over the risk-free spot curve: compensation for default risk (higher for lower ratings) and a liquidity premium. It widens on downgrades, weaker financials or risk-off sentiment and tightens when credit improves. Spread widening has the same price impact as a parallel rise in the risk-free curve – the two risks add up.",["default + liquidity","widening","additive","extra yield","risk-free + spread","wider"],"The credit spread is the extra interest a company pays above the government rate, because it might not pay back. It rises when the company's rating falls, results get worse, a recession comes, or the bond is hard to sell. Company yield = government rate + spread, so the two risks add up.","The credit spread is the extra yield over Treasuries for default and liquidity risk. It gets wider with weaker credit, recessions and poor liquidity. Yield = risk-free rate + spread, so rate risk and spread risk add up."],["Day 2","Z-spread vs option-adjusted spread (OAS)?","The z-spread assumes fixed cash flows, so it is right for option-free bonds. For callable bonds, MBS and ABS, it mixes credit risk with the value of the embedded option. The OAS strips out the option value and leaves a purer measure of credit and liquidity compensation – the standard measure for bonds with options.",["fixed cash flows","option value","callable, MBS, ABS","z-spread","OAS","removes option"],"Some bonds contain an option, e.g. a callable bond (the company can repay early). The z-spread (extra over government rates) ignores this option, so for a callable bond it looks too high, because part of it is really payment for the option. The OAS (option-adjusted spread) removes the option's value and shows the pure extra for credit risk.","The z-spread ignores built-in options; the OAS takes the option's value out first. For a callable bond, the z-spread makes the credit spread look too big, so OAS is the better number."],["Day 2","What is DV01, what is it used for, and what are its limits?","DV01 = |P(z + 1bp) − P(z)|: the dollar price change for a 1bp rise in the z-spread or, equivalently, a 1bp parallel shift of the spot curve; always positive and additive across a portfolio. Uses: risk limits, hedging (match DV01s) and position sizing. Limits: it is a linear approximation that breaks down for large moves because of convexity. Shortcut: DV01 ≈ Dmod × Price × 0.0001.",["1bp","additive","linear approximation","price change","rate risk","small moves","hedge"],"DV01 = how many dollars a bond's price changes when rates move by 0.01% (one basis point = 1bp). It tells you how much rate risk you have and how much to hedge. Limits: it only works for small moves and assumes all rates on the curve move by the same amount.","DV01 is the price change for a 1bp (0.01%) move in rates. It measures rate risk and sets hedge amounts. Limits: it only works for small moves, assumes parallel shifts, and changes as rates change."],["Day 2","What are the limitations of a DV01 hedge?","It neutralises parallel shifts only – non-parallel moves such as a steepener leave residual risk. It does not protect against credit spread widening, so rate and credit risk need separate instruments. And because DV01 is a linear approximation that changes over time and with spreads, the hedge must be rebalanced, especially after large moves.",["parallel only","spread risk","rebalance","small moves","curve twists","convexity"],"A DV01 hedge (protection that matches $ sensitivity) only works if all rates move by the same small amount. It fails if short and long rates move differently, if the move is large, or if the company's credit spread changes. And it must be adjusted over time.","It only protects against small, parallel moves. It does not cover curve twists, big moves (convexity), or credit spread changes, and it must be re-adjusted as DV01 changes."],["Day 2","What is scenario analysis and how is it done?","It estimates P&amp;L under a specified change in the spot curve or spreads – parallel shifts, steepening/flattening, inversion or historical stresses (1994, 2008, 2020). You define a vector of rate shifts per maturity, reprice every position on the new curve and take P&amp;L = repriced value − current value. Unlike DV01 it handles large and non-parallel moves; it is used for risk management, stress tests and communication with management.",["reprice","non-parallel","stress","P&L","big moves","new curve"],"You invent a 'what if' (e.g. short rates +1%, long rates +2%), recalculate the price of everything on this new curve, and see how much you'd gain or lose. Better than DV01 for big or uneven rate moves.","Pick a move for each maturity, re-price every position on the new curve, and work out P&L = new value - old value. It handles big and non-parallel moves that DV01 cannot."],["Day 2","Are forward rates forecasts? Explain.","No. A forward rate is the break-even rate implied by today's spot curve under no-arbitrage – e.g. investing 2 years at 4.5% must equal 1 year at 4% then rolling at f. It is known today; the rate that will actually prevail is unknown and may differ. The forward curve is the break-even: a rate view adds value only if realised rates deviate from the forwards.",["implied, not forecast","break-even","no-arbitrage","not a forecast","term premium","too high"],"No. A forward rate is just the rate calculated from today's curve at which all strategies end equal. It also includes extra pay for the risk of holding long bonds (a term premium), so it is usually higher than what really happens later.","No. Forward rates are break-even rates implied by today's curve, and they include a term premium, so they usually come out higher than the spot rates really turn out to be."],["Day 2","What are the sources of return in horizon analysis?","Coupon income received during the holding period (known at purchase), reinvestment return on those coupons at the scenario's short rates, and the horizon value – remaining cash flows discounted back to the horizon at the scenario's spot rates. Combined with scenarios, it shows total return under different rate paths, expressed as an annualised rate so bonds of different maturities are comparable.",["coupons","reinvestment","horizon value","sale price","three sources"],"Horizon analysis = what you earn if you hold a bond for a set time and then sell it. You earn from three things: the coupons (yearly interest) you receive, the interest you earn by reinvesting those coupons, and the price you sell the bond for at the end.","Three sources: the coupons you receive, the interest earned on reinvesting those coupons, and the horizon value (the price you sell at on the horizon date)."],["Day 2","What is the par yield and the par yield curve?","The par yield for maturity T is the coupon that makes a bond price exactly 100 when discounted at the spot rates: c = (100 − 100·DF_T) / ΣDF. Most bonds are issued near par, with coupons set at the par yield. The par curve is what the media call 'the yield curve'; par, spot and forward curves carry the same information, each derivable from the others. The swap rate equals the par yield.",["coupon for price 100","media yield curve","same information","price 100","par curve","swap rate"],"The par yield is the coupon (yearly interest) that makes a bond's price exactly 100. The par yield curve shows this coupon for each length of time. It is also the swap rate.","The par yield is the coupon rate that makes a bond's price exactly 100 for a given maturity. The par yield curve shows it for each maturity, and it equals the swap rate."],["Day 2","What is the main weakness of YTM?","YTM applies one rate to all cash flows regardless of timing. Cash is fungible – $1 in year 3 should have the same value whichever bond it comes from – but under YTM the implied discount rate depends on each bond's structure. Use YTM for quoting and trading, and spot rates and z-spreads for pricing and analytics.",["one rate for all","cash is fungible","quoting vs pricing","reinvest same rate","hold to maturity","real return differs"],"YTM (yield to maturity) assumes you hold the bond to the end and reinvest every coupon at the same rate. In reality rates change, so what you really earn can be different.","YTM assumes you reinvest every coupon at the same yield and hold the bond to the end. If rates change, your real return will be different."],["Day 2","What determines convexity, and how is it priced?","Longer maturity and lower coupon mean higher convexity; for a given duration, zero-coupon bonds have the highest convexity. Higher convexity gains more when yields fall and loses less when they rise, so investors pay for it by accepting a lower yield. In market convention 'duration' without qualification means modified duration.",["maturity, coupon","zeros highest","lower yield","longer","lower coupon","valuable"],"Convexity (the price–rate curve bending in your favour) is bigger for longer bonds and bonds with lower coupons; zero-coupon bonds have the most. Since convexity is a free bonus, investors pay for it by accepting a slightly lower yield.","Longer maturity and lower coupons give more convexity; zero-coupon bonds have the most. Because convexity is useful, investors accept a slightly lower yield to get it."],["Day 2","What is immunisation? (not from the slides – application of duration)","Immunisation protects a portfolio against rate changes by matching the duration of assets to that of liabilities (and PVs). If rates rise, asset prices fall but reinvestment income rises; if rates fall the opposite happens – with matched duration the two effects offset, so the portfolio still meets the liability. The slides list it under hedging ('immunise a portfolio, match asset cash flows to liabilities'); it requires rebalancing as durations change.",["match duration","price vs reinvestment effect","liabilities","match","offset","rebalance"],"Immunisation protects you when you must pay a fixed amount at a future date (e.g. pensions in 10 years). You set the duration of your bonds equal to that date. If rates rise, bond prices fall but you reinvest coupons at higher rates, and the reverse when rates fall. The two effects cancel out.","Match the duration of your assets to the timing of what you owe. If rates rise, the price loss is cancelled by higher reinvestment income, and the other way round. You must re-adjust it over time."],["Day 3","Why use derivatives instead of cash bonds?","A cash bond bundles income, duration, credit and inflation risk, and you can't hold one without the others. Derivatives give unfunded, precise exposure to one risk at a time – no bond bought or sold, no balance sheet use, MTM instead of forced sales, and notional and maturity can be tailored. The main cost is counterparty risk.",["isolate one risk","unfunded","counterparty risk","cheaper","faster","little cash","change risk"],"A derivative is a contract whose value depends on something else (e.g. interest rates or a bond), without owning that thing. Derivatives are cheaper and faster than buying bonds, need only a small deposit, and let you change your risk without buying or selling the bonds themselves.","Derivatives are cheaper and faster and need little cash up front. They change your risk without buying or selling the actual bonds, and they are often easier to trade than the bonds."],["Day 3","What is an interest rate swap and what is its main purpose?","Two parties exchange fixed and floating (e.g. SOFR) payments on the same notional; principal is never exchanged and only net payments settle; at inception its value is zero. Its main purpose is to manufacture DV01: the fixed leg behaves like a coupon bond, the floating leg like an FRN with almost no DV01, so the swap gives long or short duration without buying bonds.",["fixed vs floating","net settlement","manufacture DV01","swap","notional","net difference","change exposure"],"An interest rate swap is a deal between two parties on a notional amount (e.g. €10m, only used for the calculation, never paid). One pays a fixed rate (e.g. 5% every year), the other pays a floating rate (changes with the market). Only the difference is paid. Purpose: change your interest rate risk without touching your bonds or loans.","An interest rate swap trades fixed interest for floating interest on a notional amount; only the net difference is paid. Its main job is to change your interest rate exposure without trading the bonds or loans."],["Day 3","Receive fixed vs pay fixed – what is your rate exposure?","Receiving fixed is like owning a bond: <b>long DV01</b>, you gain when rates fall. Paying fixed is <b>short DV01</b>, you gain when rates rise. Pension funds receive fixed to match long-dated liabilities; asset managers pay fixed to cut duration before rate rises.",["long DV01","short DV01","pension funds","receive fixed","pay fixed","rates fall","rates rise"],"In a swap (exchange of fixed vs floating interest): receive fixed = you get a fixed rate and pay the floating rate. If rates fall, you pay less → you gain, just like owning a bond. Pay fixed = the opposite: you gain when rates rise. Pension funds receive fixed; managers who fear rising rates pay fixed.","Receiving fixed is like owning a bond: you gain when rates fall. Paying fixed is like being short a bond: you gain when rates rise."],["Day 3","Rates rise right after a swap starts. Who loses and why?","The fixed receiver loses: they are locked into the old, lower fixed rate while the floating payments they owe rise. MTM for the fixed receiver = PV(fixed leg) − PV(floating leg), which becomes negative. The fixed payer gains. The fixed receiver has certain cash flows but MTM risk; the floating side resets to par each period, so it has little MTM risk.",["MTM","PV fixed − PV floating","locked in","fixed receiver loses","fixed payer gains","floating rises"],"If rates rise, the floating rate goes up. Whoever receives fixed and pays floating now pays more but still gets the same fixed amount → they lose. The fixed payer gains.","The fixed receiver loses: the floating payments go up while their fixed rate stays the same, so the swap is now worth less to them. The fixed payer gains."],["Day 3","Give three uses of interest rate swaps.","<b>Duration management</b> – lengthen or shorten portfolio duration without trading bonds. <b>Funding conversion</b> – a bank swaps fixed loan income into floating to match deposit costs; an issuer turns fixed coupons into floating funding. <b>Expressing views</b> – receive fixed to bet on falling rates, or curve trades paying at one tenor and receiving at another.",["duration","funding conversion","views","hedging","change duration","speculation"],"Swap = exchange of fixed vs floating interest payments. 1) A company with a floating-rate loan swaps it into a fixed rate, so its payments stop changing. 2) A pension fund receives fixed to make its assets react to rates like its long-term pension promises. 3) Betting on whether rates go up or down.","Hedging (turning floating-rate debt into fixed), changing a portfolio's duration (e.g. a pension fund receiving fixed), and betting on which way rates will go."],["Day 3","How does a credit default swap work?","The protection buyer pays a periodic premium (CDS spread × notional) to the seller. If a credit event occurs – bankruptcy, failure to pay, restructuring – the seller pays notional minus recovery, with recovery set by an ISDA auction, and premiums stop. The spread is set so the contract has zero value at inception and reflects default probability and expected recovery.",["premium","credit event","notional − recovery","ISDA","buyer pays","yearly fee","default","seller pays","recovery rate","fees stop"],"A CDS (credit default swap) is insurance against a company going bankrupt. The buyer pays a yearly premium (e.g. 1.5% of the amount insured). If the company defaults (doesn't pay its debt), the seller pays the buyer the loss: amount × (1 − recovery rate), where recovery rate = the % still recovered from the company.","The buyer pays a yearly fee, called the premium (spread x notional). If the company defaults (cannot pay), the seller pays the buyer the amount x (1 - recovery rate). After that, the yearly fees stop."],["Day 3","Who is long and who is short credit in a CDS?","The <b>buyer</b> is short credit: like buying insurance, they gain if the company's credit worsens and don't need to own the bond. The <b>seller</b> is long credit: they collect premiums and bear the loss on default – economically the same as owning the bond. (Day 3 slide 15 labels this the wrong way round.)",["buyer short","seller long","seller long credit","buyer short credit","gains if worse"],"In a CDS (insurance against default): the seller of protection earns the premium as long as the company is fine, so they want the company to do well, like a bondholder → 'long credit'. The buyer of protection gains if the company gets into trouble → 'short credit'.","The protection seller is long credit: they gain if credit gets better, like owning the bond. The protection buyer is short credit: they gain if credit gets worse."],["Day 3","Why would an investor use a CDS instead of selling the bond?","A CDS removes default risk while keeping the bond – useful if the bond is illiquid, selling would trigger taxes, or the mandate requires holding it. It also allows a short credit view without owning or borrowing the bond, and synthetic long exposure where bonds are scarce; indices (CDX, iTraxx) hedge broad credit exposure. Rate and liquidity risk of the bond remain.",["hedge without selling","short credit","synthetic exposure","no selling","faster","take a view"],"A CDS (insurance against a company's default) lets you protect yourself without selling the bond. Selling may be hard (few buyers), expensive, cause taxes, or upset a client. A CDS is faster. You can also use it to bet on a company getting worse without owning its bonds.","A CDS lets you cover credit risk without selling a hard-to-trade bond, paying tax or upsetting a client. It is faster, and you can also use it to bet on a company without owning its bond."],["Day 3","What does a widening CDS spread tell you?","The market prices a higher probability of default and/or a lower expected recovery – credit quality is deteriorating. Tightening signals improvement. CDS spreads are a real-time credit signal, often more liquid and timely than bond spreads.",["default probability","market signal","wider spread","more likely to default"],"The CDS spread is the price of insurance against a company's default. If it rises (widens), insurance got more expensive: the market thinks the company is more likely to default.","A widening CDS spread means the market now thinks default is more likely."],["Day 3","How does a zero-coupon inflation swap work and who gains?","One party pays a fixed rate (the breakeven = market-expected inflation) compounded over the tenor; the other pays realised CPI growth. There is a single net payment at maturity. If actual inflation exceeds the breakeven, the inflation receiver (fixed payer) gains; if it undershoots, the fixed receiver gains.",["breakeven","single settlement","realised CPI","one payment","actual inflation","inflation receiver"],"Breakeven inflation = the inflation rate both sides agree on today. In a zero-coupon inflation swap one side pays this agreed rate, the other pays the real inflation that happens. There is one payment at the end only. If real inflation was higher than agreed, the side receiving real inflation gains.","One side pays a fixed amount from the breakeven rate, N x [(1 + b)^T - 1]; the other pays actual inflation, N x (CPI_T / CPI_0 - 1). There is one net payment at the end, and the inflation receiver wins if real inflation beats breakeven."],["Day 3","Why do pension funds receive inflation and receive fixed?","Their liabilities are long-dated and often indexed to CPI. Receiving fixed on an IRS adds duration, so assets rise when rates fall just as liabilities' PV rises. Receiving the inflation leg pays more when inflation is high, offsetting inflation-linked pension growth – at tenors (30–50y) where inflation-linked bonds may not exist. Together they are the core LDI toolkit.",["LDI","liability hedging","long tenors","receive inflation","receive fixed","risks cancel"],"A pension fund has to pay pensions that grow with inflation, and the value of these promises rises when rates fall. So it uses swaps that pay off in exactly those cases: receive inflation (gains when inflation rises) and receive fixed (gains when rates fall). Gains and losses offset.","Pension promises grow with inflation and are worth more when rates fall. Receiving inflation and receiving fixed makes the assets gain in exactly those cases, so the risks cancel out."],["Day 3","How can you create a synthetic inflation-linked bond?","Buy a nominal bond and enter a pay-fixed inflation swap: you swap the fixed inflation compensation built into the nominal yield for realised inflation. Conversely, an inflation-linked bond plus a receive-fixed swap strips out inflation and leaves pure real yield exposure.",["nominal bond + swap","real yield","nominal bond","inflation swap","acts like linker"],"An inflation-linked bond pays more w
