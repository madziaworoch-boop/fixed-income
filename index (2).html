hen inflation rises. To create one yourself: buy a normal fixed-coupon bond and enter an inflation swap where you pay fixed and receive real inflation. Together they behave like an inflation-linked bond.","Buy a normal (nominal) bond and add an inflation swap where you pay fixed and receive inflation. Together they act like an inflation-linked bond."],["Day 3","Bond futures vs interest rate swaps for managing duration?","Futures are standardised, exchange-traded and centrally cleared – no counterparty risk, daily variation margin, low cost and fast – so they suit short-term tactical duration changes. Swaps are bilateral (counterparty risk, ISDA documentation) but can be tailored to any maturity and notional, so they suit long-dated structural hedges such as pension liabilities.",["tactical vs structural","cleared","tailored","futures","swaps","counterparty risk","short-term vs long-term"],"Futures = standard contracts traded on an exchange (giełda), cheap and fast, with no risk that the other side won't pay → good for quick, short-term changes. Swaps = private contracts with a bank, can be tailored to any amount and date, but the bank could fail (counterparty risk) → good for long-term protection.","Futures are standard, exchange-traded and cheap, with no counterparty risk, so they are good for quick, short-term changes. Swaps are private and can be tailored, so they fit long-term hedges, but they carry counterparty risk."],["Day 3","How do bond futures work (margin, delivery, price)?","The buyer agrees to buy the reference bond at the futures price on delivery; positions are leveraged via initial margin and marked to market daily (variation margin), so losses can't accumulate. Few contracts are delivered; if they are, the short delivers the cheapest-to-deliver bond from a basket. Futures price ≈ spot × (1 + r)^t − carry (cost of carry).",["variation margin","CTD","cost of carry","initial margin","daily settlement","cheapest-to-deliver"],"A bond future is a contract to buy a bond later at a price agreed today. You only pay a small deposit (margin, depozyt zabezpieczający), and gains and losses are settled every day. Almost nobody actually takes the bond; most close the contract before the end.","You agree today to buy a bond at a set price later. You post initial margin, and gains and losses are settled every day (variation margin). Few are actually delivered; if they are, the seller delivers the cheapest-to-deliver bond."],["Day 3","What are swaptions, caps and floors?","A <b>payer swaption</b> is the right to enter a swap paying fixed at a set rate in the future (receiver = right to receive fixed) – used to hedge duration and liability risk. A <b>cap</b> is a series of calls on a floating rate, paying when the rate exceeds the strike – hedges floating-rate debt. A <b>floor</b> is a series of puts, paying when the rate falls below the strike – guarantees a minimum return on floating assets.",["right not obligation","cap = calls","floor = puts","swaption","cap protects borrowers","floor protects lenders"],"An option = a right, not an obligation. A swaption = the right to enter a swap (fixed vs floating exchange) later. A cap = insurance that pays if a floating rate goes above a limit, e.g. 5% (protects borrowers). A floor = pays if the rate falls below a limit, e.g. 2% (protects lenders).","A swaption is the right to enter a swap later. A cap pays out when the floating rate goes above a set level and protects borrowers. A floor pays out when the rate drops below a set level and protects lenders."],["Day 3","What problem does securitisation solve?","Banks originate loans that are illiquid and tie up capital on their balance sheet. Securitisation pools many loans and sells securities backed by their cash flows to investors, so the bank recycles capital and can lend more. Investors gain access to asset classes (mortgages, consumer credit) and diversification they could not buy otherwise.",["illiquid loans","recycle capital","access","pool loans","bank gets cash","lend again"],"A bank has lots of loans (mortgages, car loans…). They tie up its money and can't be sold. Securitisation (sekurytyzacja) = the bank packs many loans together and sells them to investors as one tradeable security. The bank gets cash back and can give new loans.","Loans are hard to sell and tie up the bank's capital. Securitisation pools them and sells them as tradeable securities, so the bank gets cash and can lend again, and investors reach new assets."],["Day 3","What is an SPV and why is 'bankruptcy-remote' essential?","A special purpose vehicle is a legally separate shell (no employees) that buys the loan pool in a true sale and issues the ABS. Because it is bankruptcy-remote, the originator's creditors can't reach the loans if the bank fails. Investors therefore bear the risk of the asset pool, not the bank – which lets a BBB-rated bank issue AAA-rated securities.",["true sale","ring-fenced","asset quality not issuer","separate company","protected if bank fails","loan risk only"],"In securitisation (packing loans into a security), the bank sells its loans to a separate company called an SPV (special purpose vehicle, spółka celowa). Bankruptcy-remote means that if the bank goes bankrupt, the bank's creditors can't take those loans. So investors only worry about the loans, not about the bank.","An SPV is a separate company that buys the loans. Bankruptcy-remote means that if the bank fails, its creditors cannot take these assets, so investors carry only the risk of the loans, not of the bank."],["Day 3","Describe the steps of a securitisation.","<b>Warehousing:</b> loans are originated and funded on a short-term credit line. <b>Structuring:</b> an arranger designs the deal and sets up the SPV. <b>Issuance:</b> the SPV sells ABS notes to investors. <b>Purchase:</b> the SPV pays the originator and takes legal title. <b>Servicing:</b> a servicer (often the originator) collects payments and passes them to investors.",["warehouse","arranger","SPV","servicer","originator","tranches","waterfall"],"Securitisation in steps: 1) A bank gives loans. 2) It sells them to an SPV (a separate company). 3) The SPV splits the pool into tranches (transze = slices with different risk). 4) Rating agencies grade each slice. 5) The slices are sold to investors. 6) Loan repayments flow to investors in a fixed order (the waterfall).","The originator makes the loans, sells them to an SPV, the SPV splits the pool into tranches, the tranches are rated and sold to investors, and borrowers' payments flow to investors through the waterfall."],["Day 3","Why is a pass-through structure not enough – what does tranching add?","In a pass-through every investor holds the same pro-rata share, so all bear the same average loss and the structure can't serve investors with different risk appetites. Tranching splits the pool into layers by seniority: losses hit the bottom first, so the same pool produces a near-riskless senior note for money funds and a high-risk junior piece for hedge funds, funding the pool more efficiently.",["same risk for all","layers","different investors","tranching","senior mezzanine equity","choose risk"],"Pass-through = the money from a pool of loans is simply passed on to all investors equally, so everyone has the same risk. Not everyone wants that. Tranching (dzielenie na transze) splits the pool into slices: senior (safest, paid first), mezzanine (middle) and equity (riskiest, takes losses first). Each investor picks the risk they want.","A pass-through gives every investor the same slice of risk. Tranching builds senior, mezzanine and equity layers with different risk and return, so each investor picks the risk they want."],["Day 3","Explain the waterfall and subordination.","Cash flows go top-down: senior is paid in full before mezzanine, then junior, then equity gets what is left. Losses go bottom-up: equity absorbs the first losses, then mezzanine, and senior only after everything below is wiped out. The protection from the tranches below is subordination – the thicker the junior layers, the more losses senior can withstand.",["cash top-down","losses bottom-up","subordination","equity first","senior paid first","junior protects senior"],"A pool of loans is split into slices (tranches): senior on top, mezzanine in the middle, equity at the bottom. Losses start at the bottom: first equity, then mezzanine, then senior. Money is paid from the top: senior first, equity gets what's left. Subordination (podporządkowanie) = the lower slices protect the higher ones.","Losses hit the equity tranche first, then mezzanine, then senior; cash is paid to senior first. The junior tranches underneath protect the ones above (subordination)."],["Day 3","Why can a senior tranche be rated AAA when the pool is BBB?","Because of subordination: a 70% senior tranche only loses money if pool losses exceed 30%, the combined size of the tranches below it, which is very unlikely if defaults are not highly correlated. Rating agencies model default probability, timing and correlation, plus credit enhancement (overcollateralisation, reserve funds). In 2008 correlation proved far higher than assumed, so AAA tranches suffered losses.",["subordination","correlation","credit enhancement","first losses below","unlikely","AAA"],"BBB = a medium-quality rating; AAA = the best. The senior (top) slice of a loan pool only loses money after all the slices below it are wiped out, e.g. after losses of more than 30%. A pool of BBB loans rarely loses that much unless everything defaults at once, so the senior slice can be rated AAA.","The junior tranches take the first losses, so the senior tranche only loses after the pool loses a lot. That is unlikely unless defaults happen together, so it can be rated AAA."],["Day 3","What went wrong with ABS ratings in 2008?","Agencies assumed low default correlation – that mortgages in different regions would not fail together – based on historical data. When house prices fell nationally, defaults became highly correlated and losses far exceeded model predictions, so AAA senior tranches took severe losses. It was a failure of the correlation assumption, not of the waterfall; investors had also relied on ratings instead of their own analysis.",["correlation","national house price fall","over-reliance on ratings","defaults together","house prices fell","AAA lost money"],"ABS = asset-backed securities: securities made from a pool of loans (e.g. mortgages). Before 2008, rating agencies assumed that mortgages would not all default at the same time. But when house prices fell across the whole US, they did. The agencies were also paid by the issuers and used bad models. So 'AAA' slices lost money.","Ratings assumed defaults were not linked, but falling house prices caused defaults everywhere at once. Add conflicts of interest and bad models, and even AAA tranches lost money."],["Day 3","Why might a bank fund itself with ABS instead of a corporate bond?","A corporate bond is priced off the bank's own rating and adds to its liabilities. ABS separates asset quality from issuer quality, so a BBB bank can fund a good mortgage pool at AAA spreads on the senior tranche – often a cheaper blended cost. It also moves assets off balance sheet (frees regulatory capital), transfers credit risk (5% retained) and reaches different investor bases.",["cheaper funding","off balance sheet","risk transfer","higher rating","cheaper","frees capital"],"ABS = securities made from a pool of the bank's loans. If the loans are good, the ABS can get a better rating than the bank itself, so investors accept a lower interest rate → cheaper funding for the bank. The loans also leave the bank's balance sheet, so it needs less capital.","ABS can get a higher rating than the bank itself, so the funding is cheaper. The loans also leave the balance sheet, which frees up regulatory capital."],["Day 3","Why do investors buy ABS?","Yield pickup over government and often comparably rated corporate bonds – compensation for complexity and illiquidity rather than more credit risk. Diversification across thousands of borrowers, access to asset classes not available as plain bonds, and predictable amortising cash flows that suit insurers and pension funds for liability matching.",["yield","diversification","access","liability matching","higher yield","choose risk","new assets"],"ABS = securities made from pools of loans (mortgages, car loans, credit cards…). Investors like them because they pay more than other bonds with the same rating, give access to new types of loans, let you choose your risk by picking a slice (tranche), and spread risk (diversification).","A higher yield than similarly rated bonds, access to new types of assets, a choice of risk through the tranches, and diversification."],["Day 3","What are the main dangers of securitisation?","Complexity and opacity, so investors relied on ratings; moral hazard – in the originate-to-distribute model the originator no longer bears the consequences of poor lending, so standards fall (hence the 5% risk retention rule); ratings failures; and systemic risk – securitisation amplifies booms and busts and spreads stress quickly through interconnected institutions.",["opacity","moral hazard","risk retention","systemic","weak lending","complexity","spreads risk"],"Securitisation = packing loans into securities and selling them. Dangers: a bank that sells its loans on doesn't care much about their quality (it's no longer its problem); the products are complex and hard to understand; ratings can be wrong; and the risk spreads through the whole financial system.","Weak lending (originate to distribute), complexity and lack of transparency, rating failures, and risk spreading through the whole system."],["Day 3","What makes MBS different from plain bonds?","US mortgages are 30-year fixed-rate, amortising loans with a free prepayment option, which for the lender is a short call on rates. Cash flows therefore depend on interest rates: when rates fall borrowers refinance (contraction risk), when rates rise they hold on (extension risk). This creates negative convexity, plus credit risk depending on pool and tranche.",["prepayment option","contraction","extension","prepay","uncertain cash flows","short a call"],"MBS = mortgage-backed securities: securities made from a pool of home loans (mortgages, kredyty hipoteczne). Homeowners can repay early (prepayment), e.g. when rates fall and they refinance. So you don't know when you'll get your money back. With a normal bond you do.","MBS payments are uncertain, because homeowners can repay early (prepay), especially when rates fall and they refinance. The investor is basically short a call option."],["Day 3","Explain contraction and extension risk.","<b>Contraction:</b> rates fall → borrowers refinance → principal comes back early → the investor must reinvest at lower rates and misses the price gain. <b>Extension:</b> rates rise → prepayment slows → the MBS's life and duration extend → the investor is stuck with a below-market rate and suffers a bigger price loss. Both work against the investor.",["rates fall","rates rise","both hurt","prepay faster","reinvest low","stuck longer"],"MBS = securities made from home loans; homeowners can repay early. Contraction risk: rates fall → people repay early → you get your money back just when you can only reinvest at low rates. Extension risk: rates rise → nobody repays early → your money is stuck longer at the old low rate.","Contraction risk: rates fall, people prepay faster, and your cash comes back when you can only reinvest it at low rates. Extension risk: rates rise, prepayments slow, and you are stuck longer in a low-yield bond."],["Day 3","Why do MBS have negative convexity?","Because the borrower can prepay: when rates fall the MBS shortens and its price gain is capped, and when rates rise it lengthens and loses more than a plain bond. So it underperforms a comparable-duration plain bond in both directions – the same logic as a callable bond, where the borrower holds the call.",["capped upside","extended downside","gain capped","full downside","negative convexity"],"MBS = securities made from home loans. Normal bond: rates fall → price rises a lot. MBS: rates fall → people repay early → the price barely rises. Rates rise → the price falls normally. Small gains, full losses = negative convexity (the price–rate curve bends against you).","When rates fall, prepayments cap the price gain; when rates rise, the price falls normally. Small upside with full downside is negative convexity."],["Day 3","IO vs PO strips – how do they react to rates?","Stripping separates interest (IO) and principal (PO); together they equal the original MBS. The <b>IO</b> gains when rates rise, because slower prepayment means interest is paid on a larger balance for longer – useful to hedge a long-duration portfolio or bet on rising rates. The <b>PO</b>, bought at a discount, gains when rates fall, because principal comes back sooner.",["IO up when rates up","PO up when rates down","opposite","interest only","principal only","prepayment"],"A mortgage payment = interest + principal (the borrowed amount, kapitał). IO (interest only) gets only the interest; PO (principal only) gets only the principal. Rates fall → people repay early → future interest disappears → IO loses. PO gets its money sooner → PO gains. They move in opposite directions.","IO gets only interest: when rates fall, people prepay and the interest disappears, so IO loses value. PO gets only principal: faster prepayment means cash comes sooner, so PO gains. They move in opposite directions."],["Day 3","What is a sequential-pay CMO and what does it achieve?","Principal from the mortgage pool is paid to tranche A until it is retired, then B, then C, then Z; interest is paid to all tranches throughout. The same pool thus produces short (A, for money funds), medium (B, C) and long (Z, for pension funds and insurers) average lives. Prepayment risk is redistributed, not eliminated.",["sequential principal","different average lives","A then B then C","short medium long","pick maturity"],"A CMO (collateralised mortgage obligation) is a pool of home loans split into slices. In a sequential-pay CMO, repaid principal (borrowed amount) goes first only to slice A until it's fully repaid, then to B, then to C. So A is short-term, C is long-term, and each investor gets the length they want.","All the principal goes to tranche A until it is fully repaid, then to B, then to C. This makes short, medium and long tranches from one pool, so investors pick the maturity they want."],["Day 3","CLO vs CDO?","A <b>CLO</b> is backed by an actively managed portfolio of leveraged loans to sub-investment-grade companies; senior tranches can still be AAA thanks to tranching and overcollateralisation – today the largest structured credit market. A <b>CDO</b> is backed by bonds, MBS tranches or other ABS; CDOs of subprime MBS were at the centre of 2008, and cash CDOs largely disappeared afterwards. (Slide 54 swaps the headers.)",["leveraged loans","ABS of ABS","2008","CLO loans","CDO bonds","actively managed"],"Both are pools split into slices (tranches). A CLO (collateralised loan obligation) holds loans to heavily indebted companies (leveraged loans), usually with floating rates, and a manager actively manages them. A CDO (collateralised debt obligation) holds bonds or other loan-backed securities, like the mortgage CDOs of 2008.","A CLO pools leveraged loans - usually floating-rate and actively managed. A CDO pools bonds or other ABS, like the mortgage CDOs of 2008."],["Day 3","How is a swap rate set at inception, and what happens if the curve then changes?","A single spot curve, seen as a series of 1-year forwards, gives the expected floating payments; the swap rate is the fixed coupon that makes PV(fixed) = PV(floating), so the swap starts at zero value – it equals the par yield. If forwards are realised the fixed payer first pays and later receives, net PV zero. If the curve flattens (future SOFR below the forwards), the fixed payer loses; if it steepens, the fixed receiver loses.",["PV fixed = PV float","forwards","par yield","equal value","starts at zero","payer gains if rates rise"],"In a swap (fixed vs floating exchange), the fixed rate at the start is set so that both sides are worth the same: the swap is worth 0. Later, if rates rise, the fixed payer gains (they now get more floating) and the fixed receiver loses.","The swap rate is set so the fixed and floating sides are worth the same, so the swap starts at zero value. If rates then rise, the fixed payer gains; if they fall, the fixed receiver gains."],["Day 3","What types of ABS exist?","MBS (residential RMBS or commercial CMBS mortgages – the largest sector), auto ABS (car loans, short average life, low defaults, liquid), credit card ABS (revolving receivables, no fixed maturity), CLOs (leveraged loans) and CDOs (bonds or ABS), plus student loans, aircraft or equipment leases and royalties – any predictable cash flow can be securitised.",["MBS","auto","credit card","CLO/CDO","student loans","predictable cash flow"],"ABS = asset-backed securities: any pool of loans packed into a tradeable security. Types: MBS (home loans, the biggest), car loans, credit card debt, CLOs (company loans), CDOs (bonds), student loans and leases. Anything with predictable payments can be packed.","MBS (the biggest), auto loans, credit cards, CLOs, CDOs, student loans and leases. Almost any steady, predictable cash flow can be securitised."],["Day 3","How are fixed income options priced? (interest rate models)","Options have uncertain payoffs, so they need a model of how rates evolve, not just today's curve. Models range from a static curve fit, to a stochastic process for rates, to a rate tree (lattice) on which cash flows are valued backwards. That is why option-embedded bonds and OAS require more than simple discounting.",["static curve","stochastic process","tree","future rates","model","rate tree"],"An option's value depends on how interest rates move in the future, and nobody knows that. So you need a model that draws many possible future paths of rates (e.g. a tree, drzewo dwumianowe) and values the option on each path.","An option's payoff depends on future rates, so you need a model of how rates might move over time (such as a rate tree), not just today's curve."],["Day 3","Who uses bond futures and for what?","Asset managers for fast, cheap tactical duration changes (buy futures to lengthen, sell to shorten; off-balance-sheet). Banks and dealers to hedge rate risk of loan portfolios and bond inventory. Hedge funds for directional and timing views (e.g. long 2Y before an expected cut) and curve trades (long 2Y / short 10Y = steepener). Futures are often more liquid than cash bonds, especially in stress.",["tactical","hedging inventory","curve trades","asset managers","hedge rate risk","hedge funds"],"Bond futures = cheap, standard exchange contracts on bonds. Fund managers use them to quickly change how sensitive their portfolio is to rates (duration). Banks use them to protect against rate changes. Hedge funds use them to bet on rates or on the shape of the yield curve.","Asset managers use them to change duration quickly and cheaply, banks and dealers to hedge rate risk, and hedge funds to bet on rates or the shape of the curve."],["Day 4","Why must the money stock grow, and what questions does that raise?","The money stock is the total money in circulation and changes as money is created and destroyed. It needs to grow because interest must be paid (money that doesn't exist when a loan is made), and population, the economy and new ideas need capital. This raises the key questions: who may create money, who receives it, through what mechanism and how much.",["interest","growth","who creates it","must grow","population","who gets it"],"The money stock = all the money in the economy. It must grow, because borrowers must pay interest (money that doesn't exist yet when the loan is made), and the population and economy keep growing. That raises questions: who may create money, who gets it first, and how much.","The money stock has to grow because interest must be paid and the economy and population keep growing. The big questions are who creates money, who gets it, how, and how much."],["Day 4","How do payments between banks settle?","Every payment between customers of different banks settles across the banks' reserve accounts at the central bank. Banks with surplus reserves lend overnight to banks with shortfalls in the interbank market at the Fed Funds rate – which is why the quantity of reserves determines that rate.",["reserve accounts","interbank market","Fed Funds","settle","reserves","overnight"],"Every bank has an account at the central bank; the money in it is called reserves (rezerwy). When you send money to someone at another bank, reserves move from your bank's account to theirs. Banks short of reserves borrow them overnight from other banks, at the Fed Funds rate.","Payments between banks settle through their reserve accounts at the central bank. A bank short of reserves borrows overnight from a bank with spare reserves, at the Fed Funds rate."],["Day 4","Where do banks get their funding?","Customer deposits (savings, checking, term – cheapest and most stable), interbank borrowing (short-term liquidity), wholesale funding markets (commercial paper, repo, short-term bills – large amounts) and central bank facilities (standing facilities, lender of last resort, emergency programmes). On a typical balance sheet deposits are about 62% of liabilities and equity about 10%; loans are about 53% of assets.",["deposits","interbank","wholesale","central bank","cheapest","repo"],"Customer deposits (cheapest and most stable, about 62% of what banks owe), loans from other banks, the wholesale market (repo = loans secured by bonds, and commercial paper = short IOUs), and the central bank in an emergency.","Customer deposits (the cheapest and most stable, about 62% of liabilities), interbank borrowing, wholesale markets (repo, commercial paper) and central bank facilities."],["Day 4","Summarise the financial system in a nutshell.","The <b>central bank</b> issues base money, sets the short rate and is lender of last resort. <b>Commercial banks</b> take deposits and create money by lending, under capital rules and deposit insurance. <b>Money market funds</b> pool short-term savings and lend via repo. <b>Dealers</b> make markets funded by repo. <b>Asset managers</b> invest for pension funds, insurers and retail – dominant bond buyers. <b>Hedge funds</b> use leverage and amplify both liquidity and volatility.",["central bank","banks","MMFs","dealers","asset managers","hedge funds","create money","leverage"],"The central bank creates base money and sets interest rates. Commercial banks create money by lending. Money market funds collect short-term savings and lend them out briefly. Dealers buy and sell securities. Asset managers invest for pension funds and savers. Hedge funds invest with borrowed money (leverage, dźwignia).","The central bank issues base money and sets rates; banks create money by lending; money market funds lend through repo; dealers make markets; asset managers invest for savers; hedge funds use leverage."],["Day 4","How has money evolved, and what is fiat money?","First money was a commodity (gold, silver), limited by mining. Then paper money backed by gold, with banks holding only fractional reserves (from 1600s goldsmiths). Today money is fiat – a pure liability of the issuer with no commodity backing, created by decree – so its quantity is a policy choice, not a physical constraint.",["commodity","backed","fiat","policy choice","gold","law and trust"],"Money started as goods (e.g. salt), then gold, then paper you could swap for gold. Today's money is fiat money (pieniądz fiducjarny): nothing backs it; it has value because the state says so and people trust it.","Money went from commodities, to gold, to gold-backed paper. Fiat money is backed by nothing physical; it has value because of law and trust in the issuer."],["Day 4","Why did the Bretton Woods system end?","From 1944, 44 currencies were pegged to the dollar and the dollar was convertible into gold at $35/oz for foreign central banks (the IMF was also created). The US issued more dollars than its gold could back to finance the Vietnam War and Great Society programmes, and France demanded gold. In 1971 Nixon closed the gold window – currencies became fiat with floating exchange rates.",["$35/oz","Vietnam","1971 Nixon","floating rates","too many dollars","ended gold"],"Bretton Woods (1944–1971): the dollar could be exchanged for gold, and other currencies were fixed to the dollar. The US printed more dollars than it had gold (Vietnam War, spending), so in 1971 Nixon stopped the exchange to gold and the system ended.","The US printed more dollars than its gold could back, other countries asked for gold, and in 1971 Nixon ended the swap of dollars for gold, which ended the system."],["Day 4","What is the difference between base money and credit money?","Base money is created by the central bank – currency plus bank reserves – and is the ultimate settlement asset, the role gold once played. Credit money is created by commercial banks when they lend and exists as deposits. Roughly 90% of money is credit money.",["central bank","commercial banks","90%","base money","credit money","deposits","lending"],"Base money = cash and banks' reserves (money banks keep at the central bank); only the central bank creates it. Credit money = the money in your bank account; a commercial bank creates it when it gives a loan. Most money is credit money.","Base money (cash and reserves) is made by the central bank. Credit money (bank deposits) is made by commercial banks when they lend, and it is most of the money in the economy."],["Day 4","How do commercial banks create money, and what limits it?","A loan creates a deposit at the same moment: loan receivable +100k and customer deposit +100k – the money did not exist before. Repayment destroys it again. Limits: demand from creditworthy borrowers (lower when rates are high) and regulation – capital, leverage and liquidity rules.",["loan creates deposit","repayment destroys","limits","new deposit","new money","capital rules"],"When a bank gives you a loan, it simply writes the money into your account; it doesn't take it from someone else. That is new money. Limits: rules on how much capital (own money) banks must hold, how many people want loans, the risk of the borrowers, and the central bank's interest rate.","When a bank makes a loan, it creates a new deposit - that is new money. What limits it: capital rules, demand for loans, credit risk, and the central bank's interest rate."],["Day 4","What are the main functions of a commercial bank?","<b>Lending</b> – allocating capital and monitoring borrowers (the main way new money enters the economy). <b>Maturity transformation</b> – funding long-term loans with short-term deposits. <b>Liquidity provision</b> – turning illiquid loans into deposits withdrawable on demand. <b>Risk transformation</b> – diversifying credit risk, with equity and deposit insurance absorbing losses.",["maturity transformation","liquidity","risk","deposits","lending","payments"],"A commercial bank takes deposits, gives loans, handles payments, turns short-term deposits into long-term loans (maturity transformation, transformacja terminów) and checks whether borrowers are safe.","Taking deposits, lending, running payments, maturity transformation (turning short deposits into long loans) and judging credit risk."],["Day 4","Liquidity risk vs solvency risk of a bank?","<b>Liquidity risk:</b> not enough liquid assets to meet withdrawals or short-term obligations – a bank run can bring down even a solvent bank. <b>Solvency risk:</b> loan losses exceed equity so liabilities exceed assets. Forced sales at depressed prices can turn a liquidity problem into a solvency one. (Day 4 slide 13 swaps the headers.)",["bank run","losses exceed capital","fire sales","liquidity","no cash","solvency","owes more","central bank can't fix solvency"],"Liquidity risk: the bank owns enough, but lacks cash today (e.g. everyone withdraws at once = a bank run). Solvency risk (wypłacalność): the bank owns less than it owes; its own money (capital) is gone. The central bank can lend cash to fix the first, not the second.","Liquidity risk: the bank is fine overall but has no cash right now, e.g. in a bank run. Solvency risk: the bank owns less than it owes. A central bank can fix a cash (liquidity) problem, but not a solvency one."],["Day 4","Which regulations address bank risks?","Capital requirements (Basel III, minimum capital vs risk-weighted assets) and the leverage ratio (Tier 1 capital vs total assets, regardless of risk weights) address solvency. The Liquidity Coverage Ratio and Net Stable Funding Ratio address short- and long-term liquidity. Reserve requirements were historically for liquidity but were abandoned in the US in 2020.",["Basel III","leverage ratio","LCR","NSFR","capital rules","solvency","liquidity"],"Against solvency (owning less than you owe): capital requirements (Basel III, banks must hold enough own money) and the leverage ratio (own money vs total assets). Against liquidity (running out of cash): the LCR (enough cash for 30 days of stress) and the NSFR (stable long-term funding). The US stopped requiring reserves in 2020.","Capital rules (Basel III) and the leverage ratio deal with solvency; the LCR and NSFR deal with liquidity. The US dropped reserve requirements in 2020."],["Day 4","What is a central bank and what is the Fed's mandate?","An independent institution, operating within a legal mandate, whose main task is monetary policy; independence shields it from short-term political pressure. It deals only with commercial banks, never directly with the public. The Fed's dual mandate is maximum employment and stable prices – the two can conflict, since fighting inflation can mean higher unemployment.",["independent","banks only","dual mandate","base money","lender of last resort","prices and jobs"],"A central bank is the bank for banks: it issues money, sets interest rates and lends to banks in a crisis (lender of last resort, pożyczkodawca ostatniej instancji). The Fed (US central bank) has two goals: stable prices (low inflation) and maximum employment.","A central bank issues base money, sets short-term rates and is the lender of last resort. The Fed's dual mandate is stable prices and maximum employment."],["Day 4","How does the Fed steer the Fed Funds rate?","The Fed Funds rate is the overnight unsecured interbank rate for reserves – a market rate, not set by decree. The Fed controls the quantity of reserves through open market operations: buying securities pays banks with new reserves, more reserves push the rate down; selling securities drains reserves and pushes it up. All other rates are priced as spreads over this benchmark.",["reserves","open market operations","benchmark","buy adds reserves","sell removes","rate down"],"Open market operations: the Fed buys or sells government bonds. When it buys, it pays banks with reserves (money at the Fed) → banks have plenty → they lend to each other cheaply → the Fed Funds rate falls. When it sells, it takes reserves away → the rate rises.","Through open market operations: buying securities adds reserves and pushes the Fed Funds rate down; selling removes reserves and pushes it up."],["Day 4","Besides open market operations, what tools does the Fed have?","<b>Interest on reserves</b> – sets a floor under the Fed Funds rate when reserves are abundant. <b>Forward guidance</b> – communication that shapes expectations of future policy. <b>Quantitative easing</b> – large purchases of long-term bonds/MBS when rates are near zero (2008, 2020). <b>Discount window</b> – lender of last resort against collateral, priced above target and carrying stigma.",["IORB","forward guidance","QE","discount window","interest on reserves"],"Interest on reserves: the Fed pays banks interest on money held at the Fed, which sets a floor for rates. Forward guidance: the Fed tells the market what it plans to do. QE (quantitative easing): buying lots of long-term bonds when rates are already near zero. The discount window: emergency loans to banks.","Interest on reserves, forward guidance (telling the market its plans), quantitative easing, and the discount window."],["Day 4","How does a Fed rate cut reach mortgage rates?","The Fed only acts on banks: a lower target lowers banks' funding costs, so the prime rate and short-term loan rates fall quickly, deposit rates more slowly. But 30-year mortgage rates depend on expected future short rates, not today's overnight rate, so they move mainly through forward guidance and directly through QE purchases of Treasuries and MBS. That's why mortgage rates react to QE more than to Fed Funds moves.",["banks' funding cost","short end","forward guidance","QE","long Treasury yields","mortgages follow"],"The Fed cuts its rate → banks borrow from each other more cheaply → short-term rates fall → markets expect more cuts → long-term government bond rates fall → mortgage rates (home loan rates), which follow the 10-year government rate, fall.","A Fed cut lowers short rates and expectations of future rates, which pulls down long-term Treasury yields, and mortgage rates follow them down."],["Day 4","What are money markets?","Markets for short-term debt (under one year), traded OTC, used by banks, firms and governments to manage cash. They are highly liquid and low-risk, and their rates track the Fed Funds rate (the short end of the curve). Instruments: T-bills, commercial paper, certificates of deposit, Fed Funds and repo.",["< 1 year","liquid","instruments","short-term","T-bills","repo","manage cash"],"Money markets are markets for very short loans, under one year: T-bills (short government bonds), repo (loans secured by bonds) and commercial paper (short company IOUs). Banks and firms use them to park spare cash or to borrow briefly.","Money markets trade short-term debt of under one year (T-bills, repo, commercial paper) and are used to manage cash and liquidity."],["Day 4","What is a repo and why is it structured as a sale?","The borrower sells securities for cash and agrees to repurchase them at a set price and date; the price difference is the repo rate. Economically it is a collateralised loan, mostly overnight (~$5T a day in the US). It is structured as a sale so the lender owns the collateral outright and can sell it immediately if the borrower defaults, without a bankruptcy queue.",["sell and repurchase","collateral","no bankruptcy queue","buy back","loan backed by bond","keep collateral"],"A repo (repurchase agreement): you sell a bond today and agree to buy it back tomorrow at a slightly higher price. In practice it is a loan with the bond as security (collateral, zabezpieczenie). It's done as a sale so that if the borrower fails, the lender already owns the bond and can sell it at once.","A repo is selling a bond and agreeing to buy it back later at a slightly higher price - really a loan backed by the bond. Making it a sale lets the lender keep and sell the bond at once if the borrower fails to pay."],["Day 4","Who participates in the repo market?","<b>Asset holders</b> (e.g. money market funds) lend cash and take Treasuries as collateral. <b>Securities dealers</b> borrow that cash and lend it on to <b>leveraged investors</b> (hedge funds), earning the spread. Hedge funds use repo to fund positions larger than their own capital.",["MMFs","dealers","hedge funds","cash lenders","cash borrowers","finance positions"],"Repo = a short loan secured by a bond. Cash lenders: money market funds, banks and companies with spare cash. Cash borrowers: dealers and hedge funds, who use the loans to finance the bonds they hold.","Cash lenders: money market funds, banks and companies. Cash borrowers: dealers and hedge funds, who use it to finance their bond positions."],["Day 4","SOFR vs Fed Funds?","Fed Funds is the unsecured overnight rate at which banks lend reserves to each other, so it includes the borrowing bank's credit risk. SOFR is computed from overnight repo secured by Treasuries, so it is closer to risk-free. SOFR replaced LIBOR as the benchmark for USD loans and derivatives. (Day 4 slide 29 swaps the headers.)",["unsecured","secured","replaced LIBOR","Fed Funds unsecured","SOFR secured","Treasuries","risk-free"],"Fed Funds rate = the rate at which banks lend reserves to each other overnight WITHOUT security, so it includes some bank risk. SOFR = the rate on overnight loans secured by US government bonds (repo), so it is almost risk-free. SOFR replaced LIBOR (an old benchmark rate) as the main reference rate.","Fed Funds is unsecured lending between banks, so it carries bank credit risk. SOFR comes from overnight repo backed by Treasuries, so it is almost risk-free. SOFR replaced LIBOR."],["Day 4","What are non-bank intermediaries ('shadow banks')?","Institutions such as private credit funds, hedge funds, money market funds and SPVs that channel savings into credit outside the regulated banking system. They cannot create money – they lend investors' funds, often leveraged with repo or commercial paper – and have no deposit insurance, so investors bear the risk directly. Less regulation lets them serve riskier borrowers and longer lock-ups.",["no money creation","no deposit insurance","less regulated","non-banks","lend outside banks","shadow banks"],"Non-bank intermediaries ('shadow banks', system bankowości równoległej) lend money but are not banks: private credit funds, hedge funds, money market funds. They can't create money (they lend investors' money), they are less regulated, and there is no deposit guarantee.","Non-banks such as private credit funds, hedge funds and money market funds that lend outside the regulated banking system. They don't create money, are less regulated, and have no deposit insurance."],["Day 4","Money market funds – role and risk?","Pooled funds investing in T-bills, commercial paper and repo, redeemable on demand, used by firms and institutions like a bank account with higher yields. They are major cash lenders in repo. Risk: no deposit insurance – in stress the NAV can fall below $1, as in 2008.",["T-bills, CP, repo","no insurance","break the buck","short-term savings","like deposits","runs"],"A money market fund collects short-term savings and lends them out briefly (repo, T-bills). People treat it like a bank account, but there is no guarantee. Risk: everyone wants their money back at once (a run), as in 2008.","Money market funds pool short-term savings and lend in the money markets. People treat them like deposits, but there is no insurance, so they can suffer runs (as in 2008)."],["Day 4","What do securities dealers do and why are they a systemic risk?","They underwrite new securities, make markets in bonds and derivatives, and act as prime brokers to hedge funds. They fund themselves mainly with overnight repo and are highly leveraged, so small asset moves can wipe out equity. When their balance sheets contract, market liquidity can disappear quickly.",["market making","repo funded","leverage","underwrite","overnight repo","liquidity dries up"],"Dealers help companies and governments sell new bonds and constantly buy and sell securities so the market works. They borrow overnight (repo) and use a lot of borrowed money (leverage). When they get into trouble they stop trading, and suddenly nobody can buy or sell easily.","Dealers underwrite new securities and make markets (quote buy and sell prices). They are funded by overnight repo and use a lot of leverage, so when they shrink, market liquidity dries up."],["Day 4","Hedge funds and the GP/LP structure?","Hedge funds are pooled vehicles for institutional investors that use leverage (repo, prime brokers) for relative value, macro and credit strategies; they add liquidity normally but can amplify stress when leveraged positions unwind together. The <b>GP</b> manages the fund (≈2% management + 20% performance fee, unlimited liability); <b>LPs</b> provide capital with liability limited to what they invested.",["leverage","GP manages","LP limited liability","pooled fund","2% + 20%","lose only invested"],"A hedge fund is an investment fund for rich people and institutions that uses borrowed money (leverage) to boost returns. The GP (general partner) runs the fund, takes about 2% a year + 20% of profits, and is fully liable. The LPs (limited partners) give the money and can lose only what they put in.","Hedge funds are pooled funds that use leverage for many strategies. The GP runs the fund (about 2% + 20% fees) with unlimited liability; the LPs put in the money and can only lose what they invested."]];

</script>
<script>
/* ---- app.js ---- */
/* ============================================================
   Fixed Income Flashcards — app logic
   Plain JS, no framework, no build step.
   ============================================================ */
"use strict";

/* ---------- Storage keys ---------- */
const LS_CODE = "fi_sync_code";
const LS_PROG = "fi_progress";

/* ---------- In-memory state ---------- */
let progress = { cards: {} };     // { cards: { idx: {status, answer, updatedAt} } }
let syncCode = "";
let filter = "All";
let order = [];                   // shuffled card indices for current deck
let pos = 0;
let cur = null;                   // { idx, step, revealed, typed }

/* ============================================================
   Local storage
   ============================================================ */
function loadLocal() {
  try {
    const p = JSON.parse(localStorage.getItem(LS_PROG) || "null");
    if (p && p.cards) progress = p;
  } catch (e) {}
  try {
    syncCode = localStorage.getItem(LS_CODE) || "";
  } catch (e) {}
  if (!syncCode) { syncCode = makeSyncCode(); saveCode(); }
}
function saveLocal() {
  try { localStorage.setItem(LS_PROG, JSON.stringify(progress)); } catch (e) {}
}
function saveCode() {
  try { localStorage.setItem(LS_CODE, syncCode); } catch (e) {}
}

/* ============================================================
   Sync code generator  (3 words + 4 digits)
   ============================================================ */
const WORDS = ("amber anchor apple arch arrow aspen atlas basil beacon birch bison blaze " +
"bloom brave breeze brook cedar cherry cliff cloud clover comet coral cove crane crest " +
"delta drift dune eagle ember fable falcon fern flint fox frost gale glade grove hazel " +
"heron ivory jade jasper koala lark lemon lilac linen lotus lunar maple marble meadow " +
"mint moss nectar nova oak ocean olive onyx opal orbit otter pearl pine plum quartz " +
"quail raven reed ridge river robin rowan ruby sage sand slate sparrow spruce stone " +
"storm sun teal thorn tide tiger topaz trail tulip valley vine violet willow wren zephyr").split(/\s+/);

function makeSyncCode() {
  function pick() { return WORDS[Math.floor(Math.random() * WORDS.length)]; }
  const digits = String(Math.floor(1000 + Math.random() * 9000));
  return pick() + "-" + pick() + "-" + pick() + "-" + digits;
}

/* ============================================================
   Progress merge  (per-card: newer updatedAt wins)
   ============================================================ */
function mergeProgress(a, b) {
  const out = { cards: {} };
  const ca = (a && a.cards) || {};
  const cb = (b && b.cards) || {};
  const keys = new Set([...Object.keys(ca), ...Object.keys(cb)]);
  keys.forEach(k => {
    const x = ca[k], y = cb[k];
    if (x && y) out.cards[k] = (y.updatedAt > x.updatedAt) ? y : x;
    else out.cards[k] = x || y;
  });
  return out;
}

/* ============================================================
   Supabase sync  (fetch REST, anon key)
   ============================================================ */
function syncConfigured() {
  const u = window.SUPABASE_URL, k = window.SUPABASE_ANON_KEY;
  return !!(u && k && u.indexOf("http") === 0 && u.indexOf("PASTE_") === -1 && k.indexOf("PASTE_") === -1);
}
function sbHeaders() {
  return {
    "apikey": window.SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + window.SUPABASE_ANON_KEY,
    "Content-Type": "application/json"
  };
}
async function sbFetchRemote(code) {
  const url = window.SUPABASE_URL.replace(/\/$/, "") +
    "/rest/v1/progress?sync_code=eq." + encodeURIComponent(code) + "&select=data,updated_at";
  const res = await fetch(url, { headers: sbHeaders() });
  if (!res.ok) throw new Error("GET " + res.status);
  const rows = await res.json();
  return (rows && rows[0]) ? rows[0].data : null;
}
async function sbPush(code, data) {
  const url = window.SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/progress";
  const body = JSON.stringify({ sync_code: code, data: data, updated_at: new Date().toISOString() });
  const res = await fetch(url, {
    method: "POST",
    headers: Object.assign(sbHeaders(), { "Prefer": "resolution=merge-duplicates" }),
    body: body
  });
  if (!res.ok) throw new Error("POST " + res.status);
}

let syncBusy = false;
let pushTimer = null;

function setPill(state) {
  const el = document.getElementById("syncPill");
  if (!el) return;
  el.className = "pill";
  if (state === "off")      { el.textContent = "Sync off"; el.classList.add("pill-off"); }
  else if (state === "sync"){ el.textContent = "Syncing…"; el.classList.add("pill-wait"); }
  else if (state === "ok")  { el.textContent = "Synced ✓"; el.classList.add("pill-ok"); }
  else                      { el.textContent = "Offline";  el.classList.add("pill-err"); }
}

/* Pull remote, merge, save, push merged back. */
async function fullSync() {
  if (!syncConfigured()) { setPill("off"); return; }
  if (syncBusy) return;
  syncBusy = true;
  setPill("sync");
  try {
    const remote = await sbFetchRemote(syncCode);
    const merged = mergeProgress(progress, remote ? remote : { cards: {} });
    progress = merged;
    saveLocal();
    await sbPush(syncCode, progress);
    setPill("ok");
    refreshCounts();
  } catch (e) {
    setPill("err");
  } finally {
    syncBusy = false;
  }
}
/* Called after each save; debounced. */
function schedulePush() {
  if (!syncConfigured()) { setPill("off"); return; }
  setPill("sync");
  clearTimeout(pushTimer);
  pushTimer = setTimeout(fullSync, 900);
}

/* ============================================================
   Keyword matching  (case-insensitive, inflection-tolerant)
   ============================================================ */
const STOP = new Set(["the","a","an","of","to","in","on","and","or","is","are","it","as","at","by","be"]);
// Derivational / verb suffixes, longest first. Plurals handled separately below.
const SUFFIXES = ["ization","isation","ational","ation","ingly","edly","fully","ness","ment",
  "ing","ive","ion","ity","est","ed","er","ly","al"];

function stem(w) {
  w = w.toLowerCase();
  // 1) normalise plurals / 3rd-person -s consistently (rates->rate, bonds->bond)
  if (w.length > 4 && w.endsWith("ies")) w = w.slice(0, -3) + "y";          // maturities->maturity
  else if (w.length > 4 && /(s|x|z|ch|sh)es$/.test(w)) w = w.slice(0, -2);  // boxes->box
  else if (w.length > 3 && w.endsWith("s") && !w.endsWith("ss")) w = w.slice(0, -1);
  // 2) strip one derivational suffix
  for (const s of SUFFIXES) {
    if (w.length - s.length >= 3 && w.endsWith(s)) { w = w.slice(0, -s.length); break; }
  }
  return w;
}
function wordsOf(text) {
  return (text || "").toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
}
function wordMatch(a, b) {
  const sa = stem(a), sb = stem(b);
  if (sa === sb) return true;
  if (sa.length >= 4 && sb.startsWith(sa)) return true;
  if (sb.length >= 4 && sa.startsWith(sb)) return true;
  return false;
}
/* Does `keyword` appear in the user's text? */
function keywordFound(keyword, textWords) {
  let parts = wordsOf(keyword);
  let sig = parts.filter(p => p.length >= 3 && !STOP.has(p));
  if (sig.length === 0) sig = parts;
  return sig.every(kw => textWords.some(tw => wordMatch(kw, tw)));
}

/* ============================================================
   Helpers
   ============================================================ */
function esc(s) {
  return (s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function fmtDate(ts) {
  try { return new Date(ts).toLocaleDateString(undefined, { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" }); }
  catch (e) { return ""; }
}
function statusOf(idx) {
  const e = progress.cards[idx];
  return e ? e.status : null;   // "got" | "again" | null
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ============================================================
   Deck building
   ============================================================ */
function indicesFor(f) {
  return CARDS.map((c, i) => i).filter(i => {
    if (f === "All") return true;
    if (f === "To review") return statusOf(i) === "again";
    if (f === "Not seen yet") return statusOf(i) === null;
    return CARDS[i][0] === f;   // "Day 1".."Day 4"
  });
}
function countFor(f) {
  if (f === "Glossary") return GLOSS.length;
  return indicesFor(f).length;
}
function startDeck(f) {
  filter = f;
  order = shuffle(indicesFor(f));
  pos = 0;
  if (order.length === 0) {
    toast("No cards here right now.");
    return;
  }
  showView("study");
  renderCard("learn");
}

/* ============================================================
   Views
   ============================================================ */
function showView(name) {
  ["home","study","glossary"].forEach(v => {
    document.getElementById("view-" + v).hidden = (v !== name);
  });
  document.getElementById("topTitle").textContent =
    name === "glossary" ? "Glossary" : name === "study" ? deckLabel(filter) : "Fixed Income";
  window.scrollTo(0, 0);
}
function deckLabel(f) {
  if (f === "All") return "All cards";
  if (f === "To review") return "To review";
  if (f === "Not seen yet") return "Not seen yet";
  return f;
}

/* ---------- HOME ---------- */
function renderHome() {
  const days = ["Day 1","Day 2","Day 3","Day 4"];
  const chips = [
    ["All","All cards"],["Day 1","Day 1"],["Day 2","Day 2"],["Day 3","Day 3"],["Day 4","Day 4"],
    ["To review","To review"],["Not seen yet","Not seen yet"]
  ];
  let html = "";

  html += `<div class="warn">${SLIDE_ERRORS}</div>`;

  html += `<p class="lead">Pick a deck. Cards come in random order. Your progress is saved on this device` +
          (syncConfigured() ? ` and synced.` : `.`) + `</p>`;

  html += `<div class="chips">`;
  chips.forEach(([f, label]) => {
    html += `<button class="chip" data-deck="${esc(f)}">${esc(label)} <span class="n">${countFor(f)}</span></button>`;
  });
  html += `<button class="chip chip-gloss" data-gloss="1">📖 Glossary <span class="n">${GLOSS.length}</span></button>`;
  html += `</div>`;

  html += `<h3 class="sec">Progress — “Got it” per day</h3>`;
  html += `<div class="bars">`;
  days.forEach(d => {
    const total = indicesFor(d).length;
    const got = indicesFor(d).filter(i => statusOf(i) === "got").length;
    const pct = total ? Math.round(got / total * 100) : 0;
    html += `<div class="bar-row">
      <div class="bar-label">${d}</div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="bar-num">${got}/${total}</div>
    </div>`;
  });
  html += `</div>`;

  const revN = countFor("To review");
  if (revN) html += `<p class="hint-line">You marked <b>${revN}</b> card${revN>1?"s":""} to review. Use the “To review” deck.</p>`;

  document.getElementById("view-home").innerHTML = html;

  document.querySelectorAll("#view-home .chip[data-deck]").forEach(b =>
    b.onclick = () => startDeck(b.getAttribute("data-deck")));
  const gb = document.querySelector("#view-home .chip[data-gloss]");
  if (gb) gb.onclick = () => { renderGlossary(); showView("glossary"); };
}

/* Update only the counts/bars after a grade without leaving the view. */
function refreshCounts() {
  if (!document.getElementById("view-home").hidden) renderHome();
}

/* ---------- STUDY ---------- */
function renderCard(step) {
  const idx = order[pos];
  const c = CARDS[idx];
  if (!cur || cur.idx !== idx) cur = { idx: idx, step: step, revealed: false, typed: "" };
  cur.step = step;

  const nav = `<div class="study-nav">
      <button id="backBtn" class="nav-btn" ${pos===0?"disabled":""}>&larr; Back</button>
      <span class="counter">Card ${pos+1} of ${order.length}</span>
      <button id="skipBtn" class="nav-btn">Skip &rarr;</button>
    </div>`;

  let body = "";
  const tag = `<span class="daytag">${esc(c[0])}</span>`;
  const st = statusOf(idx);
  const stBadge = st === "got" ? `<span class="badge badge-got">Got it</span>`
               : st === "again" ? `<span class="badge badge-again">To review</span>` : "";

  if (step === "learn") {
    body += `<div class="card">
      <div class="card-top">${tag}${stBadge}</div>
      <p class="q">${esc(c[1])}</p>`;
    if (!cur.revealed) {
      body += `<button id="showAnsBtn" class="btn btn-primary wide">Show answer</button>`;
    } else {
      body += answerBlocks(c);
      body += `<button id="recallBtn" class="btn btn-primary wide">Now write it from memory</button>`;
    }
    body += `</div>`;
  }
  else if (step === "recall") {
    body += `<div class="card">
      <div class="card-top">${tag}${stBadge}</div>
      <p class="q">${esc(c[1])}</p>
      <p class="muted">Write it in your own words, from memory.</p>
      <textarea id="recallText" class="recall" placeholder="Type your answer…" rows="7">${esc(cur.typed)}</textarea>
      <button id="checkBtn" class="btn btn-primary wide">Check</button>
      <button id="backToLearn" class="btn btn-ghost wide">Show the answer again</button>
    </div>`;
  }
  else if (step === "review") {
    const textWords = wordsOf(cur.typed);
    let found = 0;
    const total = c[3].length;
    const kw = c[3].map(k => {
      const ok = keywordFound(k, textWords);
      if (ok) found++;
      return `<span class="kw ${ok?"kw-ok":"kw-no"}">${ok?"✅":"❌"} ${esc(k)}</span>`;
    }).join("");
    const pct = total ? Math.round(found / total * 100) : 0;
    const msg = found === total ? "Excellent — you covered every key word! 🎉"
      : found >= Math.ceil(total * 0.6) ? "Good! Just add the missing ones."
      : found >= 1 ? "Keep going — check the ❌ words and the exam answer."
      : "Have a look at the exam answer, then try again.";
    const scoreClass = found === total ? "score-high" : found >= Math.ceil(total * 0.6) ? "score-mid" : "score-low";
    const scoreHtml = `<div class="score ${scoreClass}">
        <div class="score-num">${found} / ${total} key words</div>
        <div class="score-bar"><div class="score-fill" style="width:${pct}%"></div></div>
        <div class="score-msg">${msg}</div>
      </div>`;

    const prev = progress.cards[idx];
    let prevBlock = "";
    if (prev && prev.answer && prev.answer.trim()) {
      prevBlock = `<div class="prev">
        <div class="col-h">Your previous answer <span class="muted">(${fmtDate(prev.updatedAt)})</span></div>
        <div class="col-body">${esc(prev.answer)}</div></div>`;
    }

    body += `<div class="card">
      <div class="card-top">${tag}${stBadge}</div>
      <p class="q">${esc(c[1])}</p>

      <div class="review-cols">
        <div class="col">
          <div class="col-h">Your answer</div>
          <div class="col-body">${cur.typed.trim() ? esc(cur.typed) : '<span class="muted">(nothing written)</span>'}</div>
        </div>
        <div class="col">
          <div class="col-h">Answer on the exam</div>
          <div class="col-body">${esc(c[5])}</div>
        </div>
      </div>

      ${scoreHtml}

      <div class="kw-wrap"><div class="col-h">Key words</div><div class="kw-list">${kw}</div></div>

      ${prevBlock}

      <details class="full"><summary>Show full answer</summary><div class="full-body">${c[2]}</div></details>

      <div class="grade-row">
        <button id="againBtn" class="btn btn-again wide">↺ Review again</button>
        <button id="gotBtn" class="btn btn-got wide">✓ Got it</button>
      </div>
    </div>`;
  }

  document.getElementById("view-study").innerHTML = nav + body;
  wireStudy();
}

function answerBlocks(c) {
  const kw = c[3].map(k => `<span class="kw kw-plain">${esc(k)}</span>`).join("");
  return `<div class="answer">
    <div class="ablk"><div class="col-h">Simple explanation</div><div class="col-body">${esc(c[4])}</div></div>
    <div class="ablk"><div class="col-h">Answer on the exam</div><div class="col-body">${esc(c[5])}</div></div>
    <div class="ablk"><div class="col-h">Key words</div><div class="kw-list">${kw}</div></div>
    <details class="full"><summary>Show full answer</summary><div class="full-body">${c[2]}</div></details>
  </div>`;
}

function wireStudy() {
  const $ = id => document.getElementById(id);
  const back = $("backBtn"), skip = $("skipBtn");
  if (back) back.onclick = () => { if (pos > 0) { pos--; cur = null; renderCard("learn"); } };
  if (skip) skip.onclick = () => nextCard();

  const sa = $("showAnsBtn");
  if (sa) sa.onclick = () => { cur.revealed = true; renderCard("learn"); };

  const rc = $("recallBtn");
  if (rc) rc.onclick = () => { renderCard("recall"); setTimeout(() => { const t = $("recallText"); if (t) t.focus(); }, 30); };

  const rt = $("recallText");
  if (rt) rt.oninput = () => { cur.typed = rt.value; };

  const ck = $("checkBtn");
  if (ck) ck.onclick = () => { const t = $("recallText"); if (t) cur.typed = t.value; renderCard("review"); };

  const b2l = $("backToLearn");
  if (b2l) b2l.onclick = () => { const t = $("recallText"); if (t) cur.typed = t.value; cur.revealed = true; renderCard("learn"); };

  const again = $("againBtn"), got = $("gotBtn");
  if (again) again.onclick = () => grade("again");
  if (got) got.onclick = () => grade("got");
}

function grade(status) {
  const idx = cur.idx;
  progress.cards[idx] = { status: status, answer: cur.typed || "", updatedAt: Date.now() };
  saveLocal();
  schedulePush();
  nextCard();
}

function nextCard() {
  pos++;
  cur = null;
  if (pos >= order.length) { renderDeckDone(); return; }
  renderCard("learn");
}

function renderDeckDone() {
  const got = order.filter(i => statusOf(i) === "got").length;
  const again = order.filter(i => statusOf(i) === "again").length;
  document.getElementById("view-study").innerHTML = `
    <div class="card done">
      <h2>Deck finished 🎉</h2>
      <p>You went through <b>${order.length}</b> card${order.length>1?"s":""} in “${esc(deckLabel(filter))}”.</p>
      <p class="done-stats"><span class="badge badge-got">Got it ${got}</span> <span class="badge badge-again">Review again ${again}</span></p>
      <button id="restartDeck" class="btn btn-primary wide">Study this deck again</button>
      <button id="toHome" class="btn btn-ghost wide">Back to home</button>
    </div>`;
  document.getElementById("restartDeck").onclick = () => startDeck(filter);
  document.getElementById("toHome").onclick = () => goHome();
}

/* ---------- GLOSSARY ---------- */
function renderGlossary(query) {
  query = (query || "").toLowerCase().trim();
  const list = GLOSS.filter(g =>
    !query || g[0].toLowerCase().includes(query) || g[1].toLowerCase().includes(query));
  let html = `<div class="gloss-search">
      <input id="glossInput" type="search" placeholder="Search terms…" value="${esc(query)}" autocomplete="off">
    </div>
    <p class="muted gloss-count">${list.length} of ${GLOSS.length} terms</p>
    <div class="gloss-list">`;
  list.forEach(g => {
    html += `<div class="gl"><b>${esc(g[0])}</b><div>${esc(g[1])}</div></div>`;
  });
  html += `</div>`;
  if (list.length === 0) html += `<p class="muted">No term matches “${esc(query)}”.</p>`;
  document.getElementById("view-glossary").innerHTML = html;
  const gi = document.getElementById("glossInput");
  if (gi) {
    gi.oninput = () => {
      const v = gi.value, sel = gi.selectionStart;
      renderGlossary(v);
      const n = document.getElementById("glossInput");
      if (n) { n.focus(); try { n.setSelectionRange(sel, sel); } catch (e) {} }
    };
  }
}

/* ============================================================
   Settings panel
   ============================================================ */
function openSettings() {
  const on = syncConfigured();
  const body = document.getElementById("settingsBody");
  body.innerHTML = `
    <div class="set-block">
      <div class="col-h">This device’s sync code</div>
      <div class="code-box"><code id="codeText">${esc(syncCode)}</code>
        <button id="copyCode" class="btn btn-ghost small">Copy</button></div>
      <p class="muted">To sync another device, open this app there, go to Settings, and enter this code below.</p>
    </div>

    <div class="set-block">
      <div class="col-h">Use a code from another device</div>
      <div class="code-box">
        <input id="codeInput" type="text" placeholder="three-words-and-digits" autocomplete="off">
        <button id="connectCode" class="btn btn-primary small">Connect</button>
      </div>
      <p class="muted">This pulls that device’s progress and merges it with this one.</p>
    </div>

    <div class="set-block">
      <div class="col-h">Cloud sync</div>
      <p class="${on?"ok-text":"muted"}">${on ? "Supabase sync is ON." : "Supabase not set up yet — the app still works and saves on this device."}</p>
      <button id="syncNow" class="btn btn-ghost small" ${on?"":"disabled"}>Sync now</button>
    </div>

    <div class="set-block">
      <div class="col-h">Danger zone</div>
      <button id="resetProg" class="btn btn-again small">Reset my progress on this device</button>
    </div>`;
  document.getElementById("settingsOverlay").hidden = false;

  document.getElementById("copyCode").onclick = () => {
    navigator.clipboard && navigator.clipboard.writeText(syncCode);
    toast("Sync code copied");
  };
  document.getElementById("connectCode").onclick = () => {
    const v = document.getElementById("codeInput").value.trim().toLowerCase();
    if (!v) { toast("Type a code first"); return; }
    syncCode = v; saveCode();
    document.getElementById("codeText").textContent = syncCode;
    toast("Connecting…");
    fullSync().then(() => { toast("Connected & merged"); });
  };
  const sn = document.getElementById("syncNow");
  if (sn && on) sn.onclick = () => fullSync().then(() => toast("Synced"));
  document.getElementById("resetProg").onclick = () => {
    if (confirm("Erase your progress on THIS device? (Other devices and the cloud copy stay as they are.)")) {
      progress = { cards: {} };
      saveLocal();
      toast("Progress reset");
      refreshCounts();
    }
  };
}
function closeSettings() { document.getElementById("settingsOverlay").hidden = true; }

/* ============================================================
   Toast
   ============================================================ */
let toastTimer = null;
function toast(msg) {
  let t = document.getElementById("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ============================================================
   Navigation
   ============================================================ */
function goHome() { renderHome(); showView("home"); }

/* ============================================================
   Init
   ============================================================ */
function init() {
  loadLocal();

  document.getElementById("homeBtn").onclick = goHome;
  document.getElementById("settingsBtn").onclick = openSettings;
  document.getElementById("settingsClose").onclick = closeSettings;
  document.getElementById("settingsOverlay").onclick = (e) => {
    if (e.target.id === "settingsOverlay") closeSettings();
  };

  renderHome();
  showView("home");

  setPill(syncConfigured() ? "sync" : "off");
  if (syncConfigured()) fullSync();

  window.addEventListener("online", () => { if (syncConfigured()) fullSync(); });
  window.addEventListener("offline", () => setPill("err"));
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && syncConfigured()) fullSync();
  });

  // Service worker (offline)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      void 0; /* offline SW not used in single-file build */
    });
  }
}

document.addEventListener("DOMContentLoaded", init);

</script>
</body>
</html>
